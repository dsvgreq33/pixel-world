  /* =========================================================
     涟漪：每插中一下，从中心向外扩一圈，形状跟着主题变
     ========================================================= */
  function addRipple(){
    /* 散粉和唇印要盖在中心物件上，从圆中间往四周泛开 */
    const onTop=(theme.ripple==='sparkle'||theme.ripple==='kiss');
    ripples.push({r:onTop?coreR*.3:coreR*1.04, life:1, style:theme.ripple,
      accent:theme.accent, seed:Math.random()*TAU, onTop:onTop});
    if(ripples.length>9) ripples.shift();
  }
  function drawRipple(rp){
    const p=1-rp.life, r=rp.r, a=rp.life*rp.life;
    ctx.save(); ctx.globalAlpha=a;
    if(rp.style==='star'){
      for(let i=0;i<12;i++){
        const ang=i/12*TAU+rp.seed, rr=r+Math.sin(i*2.1+p*6)*3;
        drawStar(cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr,2.6*p+1.1,a,'#ffffff',0);
      }
    }else if(rp.style==='jam'){
      ctx.strokeStyle=rp.accent; ctx.lineWidth=6*p+2; ctx.lineCap='round';
      ctx.beginPath();
      for(let i=0;i<=40;i++){
        const ang=i/40*TAU, wob=Math.sin(ang*5+p*8)*4*p;
        const x=cx+Math.cos(ang)*(r+wob), y=cy+Math.sin(ang)*(r+wob);
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.stroke();
    }else if(rp.style==='thread'){
      ctx.lineWidth=1.4;
      for(let k=0;k<3;k++){
        ctx.strokeStyle=k===1?'rgba(255,255,255,.75)':rp.accent;
        ctx.setLineDash(k===0?[5,6]:[]);
        ctx.beginPath(); ctx.arc(cx,cy,r+k*5+Math.sin(p*5+k)*2,0,TAU); ctx.stroke();
      }
      ctx.setLineDash([]);
    }else if(rp.style==='staff'){
      ctx.lineWidth=1;
      for(let k=0;k<5;k++){
        ctx.strokeStyle='rgba(255,220,150,'+(0.75-k*.1)+')';
        ctx.beginPath(); ctx.arc(cx,cy,r+k*4.2,0,TAU); ctx.stroke();
      }
      for(let i=0;i<3;i++){
        const ang=rp.seed+i*2.1+p*3;
        const x=cx+Math.cos(ang)*(r+8), y=cy+Math.sin(ang)*(r+8);
        ctx.fillStyle='#ffe7b0';
        ctx.beginPath(); ctx.ellipse(x,y,4.4,3.2,-.5,0,TAU); ctx.fill();
        ctx.fillRect(x+3.6,y-9,1.4,9);
      }
    }else if(rp.style==='petal'){
      for(let i=0;i<10;i++){
        const ang=i/10*TAU+rp.seed+p;
        const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
        ctx.fillStyle=i%2?rp.accent:'#ffffff';
        ctx.globalAlpha=a*.9;
        ctx.beginPath(); ctx.ellipse(0,0,4.5*p+2,2.4*p+1.2,0,0,TAU); ctx.fill();
        ctx.restore();
      }
    }else if(rp.style==='wave'){
      for(let k=0;k<3;k++){
        ctx.strokeStyle='rgba(200,240,255,'+(0.8-k*.2)+')';
        ctx.lineWidth=2.2-k*.5; ctx.lineCap='round';
        ctx.beginPath();
        for(let i=0;i<=32;i++){
          const ang=i/32*TAU, wob=Math.sin(ang*4+p*7+k)*5;
          const x=cx+Math.cos(ang)*(r+k*7+wob), y=cy+Math.sin(ang)*(r+k*7+wob);
          i?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.stroke();
      }
      for(let i=0;i<8;i++){
        const ang=rp.seed+i*0.8+p;
        ctx.fillStyle='rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.arc(cx+Math.cos(ang)*(r+14),cy+Math.sin(ang)*(r+14),1.8,0,TAU); ctx.fill();
      }
    }else if(rp.style==='yarn'){
      ctx.lineCap='round';
      for(let k=0;k<2;k++){
        ctx.strokeStyle=k?rp.accent:'rgba(255,210,225,.9)';
        ctx.lineWidth=4.5-k*2;
        ctx.setLineDash([9,7]); ctx.lineDashOffset=(k*6)-p*40;
        ctx.beginPath(); ctx.arc(cx,cy,r+k*6,0,TAU); ctx.stroke();
      }
      ctx.setLineDash([]);
    }else if(rp.style==='glow'){
      const g=ctx.createRadialGradient(cx,cy,Math.max(1,r-14),cx,cy,r+16);
      g.addColorStop(0,'rgba(255,180,100,0)');
      g.addColorStop(.5,'rgba(255,190,120,'+(0.5*a)+')');
      g.addColorStop(1,'rgba(255,180,100,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(cx,cy,r+16,0,TAU); ctx.fill();
    }else if(rp.style==='crystal'){
      for(let i=0;i<6;i++){
        const ang=i/6*TAU+rp.seed;
        const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
        ctx.strokeStyle='rgba(210,240,255,.95)'; ctx.lineWidth=1.6;
        ctx.beginPath();
        ctx.moveTo(x,y-6*p); ctx.lineTo(x+4.4*p,y); ctx.lineTo(x,y+6*p); ctx.lineTo(x-4.4*p,y);
        ctx.closePath(); ctx.stroke();
      }
    }else if(rp.style==='scan'){
      const sweepA=rp.seed+p*4;
      ctx.strokeStyle=rp.accent; ctx.lineWidth=2.4; ctx.lineCap='round';
      ctx.beginPath(); ctx.arc(cx,cy,r,sweepA-.72,sweepA); ctx.stroke();
      ctx.globalAlpha=a*.45; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      ctx.globalAlpha=a; ctx.fillStyle='#c8fff0';
      for(let i=0;i<4;i++){
        const ang=sweepA-i*.28;
        ctx.beginPath(); ctx.arc(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,2,0,TAU); ctx.fill();
      }
    }else if(rp.style==='tick'){
      ctx.strokeStyle=rp.accent; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      ctx.globalAlpha=a*.6;
      ctx.beginPath(); ctx.arc(cx,cy,r-7,0,TAU); ctx.stroke();
      ctx.globalAlpha=a; ctx.lineWidth=1.4;
      for(let i=0;i<12;i++){
        const ang=i/12*TAU+rp.seed;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(ang)*(r-6),cy+Math.sin(ang)*(r-6));
        ctx.lineTo(cx+Math.cos(ang)*(r+3+p*4),cy+Math.sin(ang)*(r+3+p*4));
        ctx.stroke();
      }
    }else if(rp.style==='rake'){
      ctx.lineWidth=1.2;
      for(let k=0;k<4;k++){
        ctx.strokeStyle=k===0?rp.accent:'rgba(207,196,164,.75)';
        ctx.beginPath();
        for(let i=0;i<=48;i++){
          const ang=i/48*TAU, rr=r-k*5+Math.sin(ang*5+p*5)*2.2;
          const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr;
          i?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.closePath(); ctx.stroke();
      }
    }else if(rp.style==='clay'){
      for(let k=0;k<3;k++){
        ctx.strokeStyle=k===0?rp.accent:'rgba(224,177,131,.7)';
        ctx.lineWidth=2.4-k*.7;
        ctx.beginPath(); ctx.arc(cx,cy,r-k*6,rp.seed+p*2,rp.seed+p*2+4.2); ctx.stroke();
      }
    }else if(rp.style==='flag'){
      ctx.strokeStyle=rp.accent; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      for(let i=0;i<12;i++){
        const ang=i/12*TAU+rp.seed, x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
        ctx.fillStyle=i%2?'#ffd98a':'#e05a63';
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(7*p+3,2); ctx.lineTo(0,5); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }else if(rp.style==='grain'){
      ctx.strokeStyle='rgba(242,205,120,.55)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      for(let i=0;i<14;i++){
        const ang=i/14*TAU+rp.seed+p*.5, x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang+Math.PI/2);
        ctx.fillStyle=i%3?'#f6d98c':'#d09a48';
        ctx.beginPath(); ctx.ellipse(0,0,4*p+2,2*p+1,0,0,TAU); ctx.fill();
        ctx.restore();
      }
    }else if(rp.style==='arrow'){
      ctx.strokeStyle=rp.accent; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      for(let i=0;i<8;i++){
        const ang=i/8*TAU+rp.seed;
        const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
        ctx.strokeStyle=i%2?'#f3e5c6':rp.accent; ctx.lineWidth=1.8;
        ctx.beginPath(); ctx.moveTo(-7*p,0); ctx.lineTo(7*p,0); ctx.stroke();
        ctx.fillStyle=rp.accent;
        ctx.beginPath(); ctx.moveTo(7*p+3,0); ctx.lineTo(4*p,2.6); ctx.lineTo(4*p,-2.6); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }else if(rp.style==='drop'){
      for(let k=0;k<3;k++){
        ctx.strokeStyle='rgba(168,212,255,'+(.8-k*.22)+')'; ctx.lineWidth=2-k*.5;
        ctx.beginPath(); ctx.arc(cx,cy,r+k*7,0,TAU); ctx.stroke();
      }
      for(let i=0;i<8;i++){
        const ang=i/8*TAU+rp.seed;
        const x=cx+Math.cos(ang)*(r+10), y=cy+Math.sin(ang)*(r+10);
        ctx.fillStyle='rgba(214,238,255,.9)';
        ctx.beginPath(); ctx.ellipse(x,y,2.2,3.6*p+1.6,ang,0,TAU); ctx.fill();
      }
    }else if(rp.style==='sugar'){
      const cols=['#ff8fb1','#ffd166','#8fd8c0','#a9b8ff'];
      for(let i=0;i<14;i++){
        const ang=i/14*TAU+rp.seed+p;
        ctx.fillStyle=cols[i%4];
        ctx.beginPath(); ctx.arc(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,2.2+p*2,0,TAU); ctx.fill();
      }
    }else if(rp.style==='gold'){
      ctx.strokeStyle=rp.accent; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      ctx.globalAlpha=a*.55;
      ctx.beginPath(); ctx.arc(cx,cy,r-8,0,TAU); ctx.stroke();
      ctx.globalAlpha=a; ctx.lineWidth=1.4;
      for(let i=0;i<12;i++){
        const ang=i/12*TAU+rp.seed;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(ang)*(r-4),cy+Math.sin(ang)*(r-4));
        ctx.lineTo(cx+Math.cos(ang)*(r+6+p*5),cy+Math.sin(ang)*(r+6+p*5)); ctx.stroke();
      }
    }else if(rp.style==='aurora'){
      const cols=['rgba(120,255,200,.75)','rgba(120,200,255,.6)','rgba(190,150,255,.5)'];
      for(let k=0;k<3;k++){
        ctx.strokeStyle=cols[k]; ctx.lineWidth=3.4-k*.8; ctx.lineCap='round';
        ctx.beginPath();
        for(let i=0;i<=40;i++){
          const ang=i/40*TAU, rr=r+k*7+Math.sin(ang*4+T*.6+k+p*4)*4;
          const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr;
          i?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.closePath(); ctx.stroke();
      }
    }else if(rp.style==='needle'){
      ctx.strokeStyle=rp.accent; ctx.lineWidth=1.2;
      for(let i=0;i<20;i++){
        const ang=i/20*TAU+rp.seed;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r);
        ctx.lineTo(cx+Math.cos(ang)*(r+9+p*6),cy+Math.sin(ang)*(r+9+p*6)); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
    }else if(rp.style==='iris'){
      for(let k=0;k<3;k++){
        ctx.strokeStyle=k===1?rp.accent:'rgba(217,184,255,.6)'; ctx.lineWidth=2-k*.4;
        ctx.beginPath(); ctx.arc(cx,cy,r+k*6,0,TAU); ctx.stroke();
      }
      ctx.lineWidth=1;
      for(let i=0;i<24;i++){
        const ang=i/24*TAU+rp.seed;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(ang)*(r-5),cy+Math.sin(ang)*(r-5));
        ctx.lineTo(cx+Math.cos(ang)*(r+7+p*4),cy+Math.sin(ang)*(r+7+p*4)); ctx.stroke();
      }
    }else if(rp.style==='bubble'){
      for(let i=0;i<12;i++){
        const ang=i/12*TAU+rp.seed+p*.6, rr=r+(i%3)*5;
        const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr;
        ctx.fillStyle='rgba(255,240,190,.5)';
        ctx.beginPath(); ctx.arc(x,y,2.4+p*2,0,TAU); ctx.fill();
        ctx.strokeStyle=rp.accent; ctx.lineWidth=.8; ctx.stroke();
      }
    }else if(rp.style==='vine'){
      ctx.strokeStyle=rp.accent; ctx.lineWidth=1.6;
      for(let i=0;i<8;i++){
        const ang=i/8*TAU+rp.seed;
        const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
        ctx.beginPath(); ctx.arc(0,0,4+p*3,-.4,Math.PI*1.5); ctx.stroke();
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
    }else if(rp.style==='tide'){
      for(let k=0;k<4;k++){
        ctx.strokeStyle='rgba(219,232,255,'+(.8-k*.16)+')'; ctx.lineWidth=1.6;
        ctx.beginPath();
        for(let i=0;i<=40;i++){
          const ang=i/40*TAU, rr=r+k*6+Math.sin(ang*3+p*5+k)*2.4;
          const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr;
          i?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.closePath(); ctx.stroke();
      }
    }else if(rp.style==='tentacle'){
      ctx.lineCap='round';
      for(let i=0;i<9;i++){
        const ang=i/9*TAU+rp.seed;
        ctx.strokeStyle=i%2?'rgba(169,216,255,.8)':'rgba(220,245,255,.65)';
        ctx.lineWidth=2;
        ctx.beginPath();
        for(let k=0;k<=8;k++){
          const t=k/8, rr=r+t*(14+p*8), a2=ang+Math.sin(t*4+i)*.09;
          const x=cx+Math.cos(a2)*rr, y=cy+Math.sin(a2)*rr;
          k?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.stroke();
      }
    }else if(rp.style==='fluff'){
      ctx.strokeStyle='rgba(232,240,255,.85)'; ctx.lineWidth=1;
      for(let i=0;i<12;i++){
        const ang=i/12*TAU+rp.seed;
        const x=cx+Math.cos(ang)*(r+8+p*6), y=cy+Math.sin(ang)*(r+8+p*6);
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
        for(let k=-2;k<=2;k++){
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(6+p*3,k*2.2); ctx.stroke();
        }
        ctx.restore();
      }
    }else if(rp.style==='smoke'){
      /* 香炉：一缕缕烟往上飘散 */
      ctx.lineCap='round';
      for(let k=0;k<4;k++){
        ctx.strokeStyle='rgba(226,216,198,'+(.55-k*.1)+')'; ctx.lineWidth=2.6-k*.4;
        ctx.beginPath();
        for(let i=0;i<=22;i++){
          const t=i/22, ang=rp.seed+k*1.7+t*2.2;
          const rr=r+t*(10+p*10)+k*4;
          const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr-t*(6+p*14);
          i?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.stroke();
      }
    }else if(rp.style==='hex'){
      /* 蜂巢：六边形格一圈圈铺开 */
      const hr=7+p*3;
      for(let i=0;i<12;i++){
        const ang=i/12*TAU+rp.seed, x=cx+Math.cos(ang)*(r+6), y=cy+Math.sin(ang)*(r+6);
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
        ctx.strokeStyle=i%3?'rgba(255,201,74,.75)':'rgba(255,235,160,.9)'; ctx.lineWidth=1.4;
        ctx.beginPath();
        for(let k=0;k<6;k++){
          const a=k/6*TAU, px=Math.cos(a)*hr, py=Math.sin(a)*hr;
          k?ctx.lineTo(px,py):ctx.moveTo(px,py);
        }
        ctx.closePath(); ctx.stroke();
        ctx.restore();
      }
    }else if(rp.style==='ember'){
      /* 篝火：火星往上蹦 */
      ctx.strokeStyle=rp.accent; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      for(let i=0;i<14;i++){
        const ang=i/14*TAU+rp.seed, rr=r+4+(i%3)*6;
        const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr-(4+p*16)*(.4+(i%4)*.2);
        ctx.fillStyle=i%2?'#ffd873':'#ff8a3c';
        ctx.beginPath(); ctx.arc(x,y,1.2+p*1.6,0,TAU); ctx.fill();
      }
    }else if(rp.style==='sparkle'){
      /* 散粉盒：粉雾从圆中间往四周泛开，闪粉随扩散环撒出去 */
      const gl=Math.sqrt(a);
      const fog=ctx.createRadialGradient(cx,cy,0,cx,cy,r+20);
      fog.addColorStop(0,'rgba(255,226,240,'+(.3*gl).toFixed(3)+')');
      fog.addColorStop(.7,'rgba(255,205,230,'+(.14*gl).toFixed(3)+')');
      fog.addColorStop(1,'rgba(255,200,225,0)');
      ctx.fillStyle=fog; ctx.beginPath(); ctx.arc(cx,cy,r+20,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(255,214,234,'+(.85*gl).toFixed(3)+')'; ctx.lineWidth=6*p+1.4;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      ctx.globalAlpha=gl;
      for(let i=0;i<22;i++){
        const ang=i/22*TAU+rp.seed, rr=r*(.62+(i%4)*.13);
        const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr;
        const s=1.2+p*2+(i%3)*.6;
        ctx.fillStyle=i%3===0?'#ffffff':(i%3===1?'#ffe4f0':'#ffc4dc');
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang+p);
        ctx.beginPath();
        ctx.moveTo(0,-s*1.8); ctx.lineTo(s*.42,-s*.42); ctx.lineTo(s*1.8,0);
        ctx.lineTo(s*.42,s*.42); ctx.lineTo(0,s*1.8); ctx.lineTo(-s*.42,s*.42);
        ctx.lineTo(-s*1.8,0); ctx.lineTo(-s*.42,-s*.42); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha=a;
    }else if(rp.style==='kiss'){
      /* 随身化妆镜：一枚唇印从圆中间渐渐放大晕开，粉波纹一圈圈往四周推 */
      const gl=Math.sqrt(a), s=1.1+p*1.15;
      ctx.strokeStyle='rgba(255,158,192,'+(.62*gl).toFixed(3)+')'; ctx.lineWidth=2.8;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
      ctx.strokeStyle='rgba(255,190,215,'+(.38*gl).toFixed(3)+')'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(cx,cy,r*.7,0,TAU); ctx.stroke();
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.sin(rp.seed)*.1);
      ctx.fillStyle='rgba(216,52,96,'+(.88*gl).toFixed(3)+')';
      ctx.beginPath();
      ctx.moveTo(0,-2*s);
      ctx.bezierCurveTo(-5*s,-11*s,-13*s,-9*s,-16*s,-3*s);
      ctx.bezierCurveTo(-10*s,-3*s,-5*s,-1*s,0,-2*s);
      ctx.bezierCurveTo(5*s,-1*s,10*s,-3*s,16*s,-3*s);
      ctx.bezierCurveTo(13*s,-9*s,5*s,-11*s,0,-2*s);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-16*s,-3*s);
      ctx.bezierCurveTo(-10*s,10*s,10*s,10*s,16*s,-3*s);
      ctx.bezierCurveTo(9*s,1*s,-9*s,1*s,-16*s,-3*s);
      ctx.fill();
      /* 唇峰高光，让唇形更认得出 */
      ctx.strokeStyle='rgba(255,205,220,'+(.5*gl).toFixed(3)+')'; ctx.lineWidth=.9;
      ctx.beginPath(); ctx.moveTo(-11*s,-5*s); ctx.quadraticCurveTo(-5*s,-8*s,0,-2*s);
      ctx.quadraticCurveTo(5*s,-8*s,11*s,-5*s); ctx.stroke();
      ctx.restore();
    }else if(rp.style==='lotus'){
      /* 莲蓬：花瓣与涟漪一起从中心荡开 */
      ctx.strokeStyle='rgba(180,225,190,'+(.5*a).toFixed(3)+')'; ctx.lineWidth=1.6;
      for(let k=0;k<3;k++){
        ctx.beginPath();
        for(let i=0;i<=40;i++){
          const ang=i/40*TAU, rr=r+k*7+Math.sin(ang*6+p*5+k)*3;
          const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr;
          i?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.closePath(); ctx.stroke();
      }
      for(let i=0;i<8;i++){
        const ang=i/8*TAU+rp.seed+p, x=cx+Math.cos(ang)*(r+8), y=cy+Math.sin(ang)*(r+8);
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
        ctx.fillStyle='rgba(244,166,192,'+(.85*a).toFixed(3)+')';
        ctx.beginPath(); ctx.ellipse(0,0,4+p*3,2+p*1.4,0,0,TAU); ctx.fill();
        ctx.restore();
      }
    }else if(rp.style==='beat'){
      /* 架子鼓：鼓面被敲出的几道冲击环 */
      for(let k=0;k<4;k++){
        ctx.strokeStyle='rgba(255,154,122,'+(.7-k*.14).toFixed(3)+')'; ctx.lineWidth=3-k*.5;
        ctx.beginPath(); ctx.arc(cx,cy,r+k*9,0,TAU); ctx.stroke();
      }
      for(let i=0;i<8;i++){
        const ang=i/8*TAU+rp.seed;
        ctx.strokeStyle='rgba(255,220,190,.7)'; ctx.lineWidth=1.4;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r);
        ctx.lineTo(cx+Math.cos(ang)*(r+9+p*7),cy+Math.sin(ang)*(r+9+p*7)); ctx.stroke();
      }
    }else if(rp.style==='keys'){
      /* 琴键：一小片黑白键随波纹排开 */
      for(let i=0;i<14;i++){
        const ang=i/14*TAU+rp.seed, x=cx+Math.cos(ang)*(r+5), y=cy+Math.sin(ang)*(r+5);
        ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
        ctx.fillStyle=i%3===0?'#22242c':'#f6f2e6';
        ctx.fillRect(-3,-5,6,10);
        ctx.restore();
      }
    }else if(rp.style==='wood'){
      /* 木鱼：木纹一圈圈往外推 */
      for(let k=0;k<4;k++){
        ctx.strokeStyle='rgba(224,168,106,'+(.7-k*.14).toFixed(3)+')'; ctx.lineWidth=2.2-k*.3;
        ctx.beginPath();
        for(let i=0;i<=40;i++){
          const ang=i/40*TAU, rr=r+k*7+Math.sin(ang*5+p*4+k)*3.2;
          const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr;
          i?ctx.lineTo(x,y):ctx.moveTo(x,y);
        }
        ctx.closePath(); ctx.stroke();
      }
    }else if(rp.style==='citrus'){
      /* 橙子：一瓣瓣果肉从中心旋开 */
      for(let i=0;i<9;i++){
        const ang=i/9*TAU+rp.seed+p*.4;
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
        ctx.fillStyle='rgba(255,166,60,'+(.8*a).toFixed(3)+')';
        ctx.beginPath(); ctx.ellipse(0,-r*.72,4+p*3,8+p*5,0,0,TAU); ctx.fill();
        ctx.restore();
      }
      ctx.strokeStyle='rgba(255,225,175,'+(.6*a).toFixed(3)+')'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.stroke();
    }
    ctx.restore();
  }

  /* ---------- 粒子 ---------- */
  function spawn(x,y,color,n,power){
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, v=(Math.random()*.7+.3)*(power||1);
      particles.push({x,y,vx:Math.cos(a)*v*130,vy:Math.sin(a)*v*130-30,
        life:1,r:Math.random()*2.6+1.2,c:color});
    }
  }
  function vibrate(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  /* =========================================================
     撞针反馈：十几种轻轻的失败特效，随机落在撞针点
     淡淡的基调不破坏——短命、半透明、不铺满屏，只有 BOOM 牌是高饱和的一点俏皮
     ========================================================= */
  const FAIL_KINDS=['shard','boom','tar','feather','rose','ink','glass','bubble',
                    'stardust','ribbon','water','petal','paper','smoke','halo','confetti'];
  function triggerFail(x,y){
    const kind=FAIL_KINDS[Math.floor(Math.random()*FAIL_KINDS.length)];
    const parts=[], N=12+Math.floor(Math.random()*10);
    for(let i=0;i<N;i++) parts.push({a:Math.random()*TAU,sp:rnd(26,96),
      r:rnd(1.1,3.6),p:Math.random()*TAU,g:rnd(-1,1),t:Math.random(),rot:rnd(-3,3)});
    fails.push({kind:kind,x:x,y:y,t:0,life:1.4,seed:Math.random()*TAU,parts:parts,col:theme.accent});
    if(fails.length>3) fails.shift();
  }
  function updateFails(dt){
    for(let i=fails.length-1;i>=0;i--){ fails[i].t+=dt; if(fails[i].t>=fails[i].life) fails.splice(i,1); }
  }
  function drawFail(f){
    const p=clamp(f.t/f.life,0,1), a=Math.pow(1-p,1.2), E=1-Math.pow(1-p,2.2);
    const R=Math.min(W,H);
    ctx.save(); ctx.translate(f.x,f.y); ctx.globalAlpha=a;
    if(f.kind==='shard'){
      for(const q of f.parts){
        const d=q.sp*E*1.5, x=Math.cos(q.a)*d, y=Math.sin(q.a)*d+p*p*22;
        ctx.fillStyle=q.g>.3?'#ff9db0':'#ff7088';
        ctx.beginPath(); ctx.arc(x,y,q.r*(1-p*.5),0,TAU); ctx.fill();
      }
    }else if(f.kind==='boom'){
      /* 高饱和波点复古小广告牌，写着 BOOM */
      const s=clamp(p*5,0,1)*(1-p*.25), rot=Math.sin(f.seed)*.18;
      ctx.rotate(rot); ctx.scale(s,s);
      const w=76,h=40;
      ctx.fillStyle='#ffd83b'; ctx.strokeStyle='#e8462f'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.roundRect(-w/2,-h/2,w,h,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='rgba(232,70,47,.55)';
      for(let i=-2;i<=2;i++)for(let j=-1;j<=1;j++){
        ctx.beginPath(); ctx.arc(i*15+6,j*13,1.7,0,TAU); ctx.fill(); }
      ctx.fillStyle='#e8462f'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='800 21px system-ui,sans-serif';
      ctx.fillText('BOOM',0,1);
      /* 放射小尖角 */
      ctx.strokeStyle='rgba(255,216,59,.9)'; ctx.lineWidth=2;
      for(let i=0;i<8;i++){ const ang=i/8*TAU+f.seed;
        ctx.beginPath(); ctx.moveTo(Math.cos(ang)*44,Math.sin(ang)*26);
        ctx.lineTo(Math.cos(ang)*54,Math.sin(ang)*33); ctx.stroke(); }
    }else if(f.kind==='tar'){
      /* 粘稠沥青由撞针点向下流淌 */
      ctx.fillStyle='#1b1418';
      for(let i=0;i<5;i++){
        const ox=(i-2)*9+Math.sin(f.seed+i)*3, drop=clamp((p-qfake(i))/.6,0,1);
        const len=R*.5*drop;
        ctx.beginPath(); ctx.moveTo(ox-4,0); ctx.quadraticCurveTo(ox-3,len*.5,ox-2.4,len);
        ctx.lineTo(ox+2.4,len); ctx.quadraticCurveTo(ox+3,len*.5,ox+4,0); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(ox,len,4.2,0,TAU); ctx.fill();
      }
      ctx.fillStyle='#0d0a0c'; ctx.beginPath(); ctx.ellipse(0,-2,20,7,0,0,TAU); ctx.fill();
    }else if(f.kind==='feather'){
      /* 白色鹅绒毛炸开，柔软地飘 */
      for(const q of f.parts){
        const d=q.sp*E*1.2, x=Math.cos(q.a)*d, y=Math.sin(q.a)*d+p*p*10;
        ctx.save(); ctx.translate(x,y); ctx.rotate(q.a+q.rot*p+q.p);
        ctx.fillStyle='rgba(255,255,255,.92)';
        ctx.beginPath(); ctx.ellipse(0,0,q.r*3.4,q.r*1.2,0,0,TAU); ctx.fill();
        ctx.strokeStyle='rgba(240,244,255,.8)'; ctx.lineWidth=.7;
        for(let k=-2;k<=2;k++){ ctx.beginPath(); ctx.moveTo(k*q.r,-q.r*.5);
          ctx.lineTo(k*q.r*1.3,-q.r*1.3); ctx.stroke(); }
        ctx.restore();
      }
    }else if(f.kind==='rose'){
      /* 酒红色玫瑰花瓣随风飘散 */
      for(const q of f.parts){
        const d=q.sp*E*1.4, x=Math.cos(q.a)*d+p*24, y=Math.sin(q.a)*d+p*p*30;
        ctx.save(); ctx.translate(x,y); ctx.rotate(q.a+q.rot*p);
        const s=q.r*2.6;
        ctx.fillStyle=q.g>0?'#8e2136':'#b64059';
        ctx.beginPath(); ctx.moveTo(0,-s); ctx.quadraticCurveTo(s,-s*.2,0,s);
        ctx.quadraticCurveTo(-s,-s*.2,0,-s); ctx.fill();
        ctx.restore();
      }
    }else if(f.kind==='ink'){
      /* 一滴墨在水里晕开：深墨团 + 一圈浅水痕边，深色背景上也看得见 */
      const rr=8+E*R*.24;
      const g=ctx.createRadialGradient(0,0,1,0,0,rr);
      g.addColorStop(0,'rgba(74,66,104,.72)'); g.addColorStop(.62,'rgba(58,54,90,.42)');
      g.addColorStop(.88,'rgba(150,150,190,.13)'); g.addColorStop(1,'rgba(150,150,190,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,rr,0,TAU); ctx.fill();
      ctx.strokeStyle='rgba(190,190,225,'+(.42*a).toFixed(3)+')'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(0,0,rr*.82,0,TAU); ctx.stroke();
      ctx.fillStyle='rgba(28,26,46,.85)';
      ctx.beginPath(); ctx.arc(0,0,3+E*3,0,TAU); ctx.fill();
      for(const q of f.parts){ const d=q.sp*E*1.1;
        ctx.fillStyle=q.g>0?'rgba(120,116,158,.7)':'rgba(40,38,66,.8)';
        ctx.beginPath(); ctx.arc(Math.cos(q.a)*d,Math.sin(q.a)*d,q.r,0,TAU); ctx.fill(); }
    }else if(f.kind==='glass'){
      /* 玻璃碎裂：细裂纹 + 几片反光碎片 */
      ctx.strokeStyle='rgba(220,240,255,.8)'; ctx.lineWidth=1;
      for(let i=0;i<7;i++){ const ang=i/7*TAU+f.seed;
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(ang)*R*.2*E,Math.sin(ang)*R*.2*E); ctx.stroke(); }
      for(const q of f.parts){ const d=q.sp*E*1.4;
        ctx.save(); ctx.translate(Math.cos(q.a)*d,Math.sin(q.a)*d+p*p*20); ctx.rotate(q.rot*p);
        ctx.fillStyle='rgba(210,235,255,.7)';
        ctx.beginPath(); ctx.moveTo(0,-q.r*2); ctx.lineTo(q.r*1.5,q.r*1.6);
        ctx.lineTo(-q.r*1.5,q.r*1.2); ctx.closePath(); ctx.fill(); ctx.restore(); }
    }else if(f.kind==='bubble'){
      for(const q of f.parts){
        const x=q.g*30+Math.sin(q.p+T*.8+f.seed)*10, y=-p*R*.42*(.5+q.t)-q.sp*E*.4;
        ctx.strokeStyle='rgba(200,235,255,.75)'; ctx.lineWidth=1;
        ctx.fillStyle='rgba(190,225,255,.15)';
        ctx.beginPath(); ctx.arc(x,y,q.r*2.2,0,TAU); ctx.fill(); ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.arc(x-q.r*.6,y-q.r*.6,q.r*.4,0,TAU); ctx.fill();
      }
    }else if(f.kind==='stardust'){
      for(const q of f.parts){ const d=q.sp*E*1.6, x=Math.cos(q.a)*d, y=Math.sin(q.a)*d;
        drawStar(x,y,q.r*1.8*(1-p*.4),a,q.g>.3?'#fff2c0':f.col,0); }
    }else if(f.kind==='ribbon'){
      for(let i=0;i<5;i++){ const col=['#ff9db0','#ffd166','#8fd8c0','#a9b8ff','#ffb3d9'][i];
        ctx.strokeStyle=col; ctx.lineWidth=2.6; ctx.lineCap='round';
        ctx.beginPath();
        for(let k=0;k<=18;k++){ const t=k/18, ang=i/5*TAU+f.seed, d=t*R*.18*E;
          const x=Math.cos(ang)*d+Math.sin(t*8+i)*6, y=Math.sin(ang)*d+Math.cos(t*7+i)*6;
          k?ctx.lineTo(x,y):ctx.moveTo(x,y); }
        ctx.stroke(); }
    }else if(f.kind==='water'){
      for(let k=0;k<3;k++){ ctx.strokeStyle='rgba(180,225,245,'+(.7-k*.2)+')'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(0,0,(E*R*.2)*(1-k*.18)+k*6,0,TAU); ctx.stroke(); }
      for(const q of f.parts){ const d=q.sp*E*1.1;
        ctx.fillStyle='rgba(200,240,255,.85)';
        ctx.beginPath(); ctx.arc(Math.cos(q.a)*d,Math.sin(q.a)*d-p*p*14,q.r,0,TAU); ctx.fill(); }
    }else if(f.kind==='petal'){
      for(const q of f.parts){ const d=q.sp*E*1.3, x=Math.cos(q.a)*d+p*18, y=Math.sin(q.a)*d+p*p*26;
        ctx.save(); ctx.translate(x,y); ctx.rotate(q.rot*p+q.a);
        ctx.fillStyle=q.g>0?'#ffd9e6':'#ffb8cf';
        ctx.beginPath(); ctx.ellipse(0,0,q.r*2.4,q.r*1.1,0,0,TAU); ctx.fill(); ctx.restore(); }
    }else if(f.kind==='paper'){
      const cols=['#ff9db0','#ffd166','#8fd8c0','#a9b8ff','#fff0b0'];
      f.parts.forEach((q,i)=>{ const d=q.sp*E*1.4;
        ctx.save(); ctx.translate(Math.cos(q.a)*d,Math.sin(q.a)*d+p*p*30); ctx.rotate(q.rot*p+q.p);
        ctx.fillStyle=cols[i%5]; ctx.fillRect(-q.r,-q.r*.6,q.r*2,q.r*1.2); ctx.restore(); });
    }else if(f.kind==='smoke'){
      for(let i=0;i<4;i++){ const rr=8+E*R*.14+i*6, yy=-p*22-i*5;
        const g=ctx.createRadialGradient(0,yy,2,0,yy,rr);
        g.addColorStop(0,'rgba(220,224,236,.28)'); g.addColorStop(1,'rgba(220,224,236,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,yy,rr,0,TAU); ctx.fill(); }
    }else if(f.kind==='halo'){
      for(let k=0;k<4;k++){ ctx.strokeStyle='rgba(255,255,255,'+(.5-k*.1)+')'; ctx.lineWidth=2-k*.3;
        ctx.beginPath(); ctx.arc(0,0,E*R*.28+k*8,0,TAU); ctx.stroke(); }
    }else if(f.kind==='confetti'){
      const cols=['#ffd83b','#ff6f91','#7ee0c0','#8fb4ff','#ff9f68'];
      for(const q of f.parts){ const d=q.sp*E*1.7;
        ctx.save(); ctx.translate(Math.cos(q.a)*d,Math.sin(q.a)*d+p*p*26); ctx.rotate(q.rot*p);
        ctx.fillStyle=cols[Math.floor((q.t*5))%5];
        ctx.beginPath(); ctx.ellipse(0,0,q.r*1.6,q.r*.7,0,0,TAU); ctx.fill(); ctx.restore(); }
    }
    ctx.restore();
  }
  function qfake(i){ return .04+i*.05; }   /* 沥青几缕错开起落 */

  /* =========================================================
     场景特效：坐标全部确定性（hash），只靠 T 缓缓推进，绝不每帧随机闪烁
     ========================================================= */
  function hash(i,s){ const x=Math.sin(i*127.1+s*311.7)*43758.5453; return x-Math.floor(x); }
  function drawSceneBack(){
    const k=theme.key;
    if(k==='rain'){
      /* 斜雨丝 */
      ctx.lineCap='round';
      for(let i=0;i<72;i++){
        const x=hash(i,1)*W, y=((hash(i,2)*(H+40)+T*(220+hash(i,3)*200))%(H+40))-20;
        const len=9+hash(i,4)*16;
        ctx.strokeStyle='rgba(190,225,255,'+(.08+hash(i,5)*.16).toFixed(3)+')'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-3,y+len); ctx.stroke();
      }
    }else if(k==='snow'){
      /* 小雪，慢慢飘、轻轻摆 */
      for(let i=0;i<48;i++){
        const x=hash(i,5)*W+Math.sin(T*.55+i)*9;
        const y=((hash(i,6)*(H+20)+T*(16+hash(i,7)*24))%(H+20))-10;
        ctx.fillStyle='rgba(255,255,255,'+(.28+hash(i,8)*.35).toFixed(3)+')';
        ctx.beginPath(); ctx.arc(x,y,.8+hash(i,9)*1.9,0,TAU); ctx.fill();
      }
    }else if(k==='carousel'){
      /* 礼炮彩带：从屏幕两下角斜着喷出，卷曲着飘落 */
      const cols=['#ff9db0','#ffd166','#8fd8c0','#a9b8ff','#ffb3d9','#fff0b0'];
      for(let i=0;i<20;i++){
        const side=i%2?1:-1, seed=hash(i,10);
        const baseX=side>0?W*.9:W*.1;
        const prog=(T*.10+seed)%1;
        const x0=baseX+side*Math.sin(i)*14;
        const y0=H*(1-prog)*.5+H*.14;
        ctx.strokeStyle=cols[i%6]; ctx.globalAlpha=(.18+seed*.22)*clamp(prog*4,0,1)*clamp((1-prog)*3,0,1);
        ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.beginPath();
        for(let j=0;j<=16;j++){
          const t=j/16, xx=x0+Math.sin(t*9+i+T*2)*10+side*t*30;
          const yy=y0+t*46+Math.cos(t*7+i)*5;
          j?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
        }
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }else if(k==='incense'){
      /* 香炉烟雾缭绕：几缕从下方升起，越上越散 */
      for(let i=0;i<4;i++){
        const bx=cx+(i-1.5)*26;
        ctx.strokeStyle='rgba(220,214,196,.13)'; ctx.lineWidth=7; ctx.lineCap='round';
        ctx.beginPath();
        for(let j=0;j<=26;j++){
          const t=j/26, yy=H*.72-t*H*.5, wob=Math.sin(t*7+T*.7+i*1.7)*(12+t*30);
          const xx=bx+wob;
          j?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);
        }
        ctx.stroke();
      }
    }else if(k==='pond'||k==='fishtank'||k==='hotpot'){
      /* 水面上此起彼伏的小涟漪 */
      for(let i=0;i<4;i++){
        const px=hash(i,15)*W, py=H*.18+hash(i,16)*H*.7;
        const ph=(T*.35+hash(i,17))%1, rr=4+ph*46;
        ctx.strokeStyle='rgba(180,225,235,'+(.22*(1-ph)).toFixed(3)+')'; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.ellipse(px,py,rr,rr*.36,0,0,TAU); ctx.stroke();
      }
    }else if(k==='firefly'){
      /* 罐外几点游动的萤火 */
      for(let i=0;i<10;i++){
        const x=hash(i,18)*W+Math.sin(T*.5+i)*20;
        const y=hash(i,19)*H+Math.cos(T*.42+i)*18;
        const gl=.3+.7*(.5+.5*Math.sin(T*2+i));
        const g=ctx.createRadialGradient(x,y,0,x,y,9);
        g.addColorStop(0,'rgba(232,245,154,'+(.5*gl).toFixed(3)+')');
        g.addColorStop(1,'rgba(232,245,154,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,9,0,TAU); ctx.fill();
      }
    }
  }
  function drawSceneFront(){
    /* 屏幕级：贴在玻璃上的一层，淡淡的不挡游戏 */
    const k=theme.key;
    if(k==='rain'){
      /* 朦胧水汽 + 玻璃雨滴（固定位置，个别缓缓滑下） */
      ctx.fillStyle='rgba(150,185,220,.05)'; ctx.fillRect(0,0,W,H);
      for(let i=0;i<13;i++){
        let x=hash(i,20)*W, y=hash(i,21)*H;
        if(i%4===0) y=((y+T*11)%(H+30))-15;   /* 几滴慢慢往下滑 */
        const r=3+hash(i,22)*7;
        const g=ctx.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r);
        g.addColorStop(0,'rgba(230,245,255,.20)'); g.addColorStop(.7,'rgba(180,215,245,.06)');
        g.addColorStop(1,'rgba(180,215,245,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x,y,r,r*1.18,0,0,TAU); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.22)';
        ctx.beginPath(); ctx.arc(x-r*.32,y-r*.42,r*.18,0,TAU); ctx.fill();
      }
    }else if(k==='powder'){
      /* 两道柔和的斜光束 + 一层朦胧粉 */
      ctx.save(); ctx.globalCompositeOperation='lighter';
      for(let i=0;i<2;i++){
        const off=i*W*.55-W*.1;
        const g=ctx.createLinearGradient(off,0,off+W*.34,H);
        g.addColorStop(0,'rgba(255,214,234,.10)'); g.addColorStop(1,'rgba(255,214,234,0)');
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.moveTo(off,0); ctx.lineTo(off+W*.20,0);
        ctx.lineTo(off+W*.52,H); ctx.lineTo(off+W*.30,H); ctx.closePath(); ctx.fill();
      }
      const fg=ctx.createRadialGradient(cx,cy*.8,0,cx,cy,Math.max(W,H)*.7);
      fg.addColorStop(0,'rgba(255,190,220,.055)'); fg.addColorStop(1,'rgba(255,190,220,0)');
      ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
      ctx.restore();
      for(let i=0;i<16;i++){
        const x=hash(i,23)*W+Math.sin(T*.4+i)*8;
        const y=((hash(i,24)*H+T*(8+hash(i,25)*10))%H);
        ctx.fillStyle='rgba(255,224,238,'+(.2+hash(i,26)*.3).toFixed(3)+')';
        ctx.beginPath(); ctx.arc(x,y,.8+hash(i,27)*1.6,0,TAU); ctx.fill();
      }
    }else if(k==='snow'){
      /* 屏幕上下边缘薄薄一层积雪 */
      ctx.save();
      const tg=ctx.createLinearGradient(0,0,0,46);
      tg.addColorStop(0,'rgba(255,255,255,.20)'); tg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=tg; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(W,0);
      for(let x=W;x>=0;x-=18) ctx.lineTo(x,14+Math.sin(x*.05)*7+hash(x,28)*8);
      ctx.closePath(); ctx.fill();
      const bg=ctx.createLinearGradient(0,H,0,H-38);
      bg.addColorStop(0,'rgba(255,255,255,.16)'); bg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=bg; ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(W,H);
      for(let x=W;x>=0;x-=18) ctx.lineTo(x,H-11-Math.sin(x*.06)*6-hash(x,29)*7);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  function drawSparks(){
    for(const s of sparks){
      const p=clamp(s.t/s.life,0,1), a=1-p;
      ctx.save(); ctx.globalAlpha=a;
      if(s.k==='mote'){
        ctx.fillStyle=theme.accent;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r*(1-p*.4),0,TAU); ctx.fill();
      }else if(s.k==='glimmer'){
        const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,10);
        g.addColorStop(0,hexA(theme.accent,.55*a)); g.addColorStop(1,hexA(theme.accent,0));
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,s.y,10,0,TAU); ctx.fill();
      }else if(s.k==='arrow'){
        /* 破空箭影：一道斜掠而过的白痕 */
        const e=1-Math.pow(1-p,2), x=-40+e*(W+80), y=H*.3+e*40;
        ctx.strokeStyle='rgba(235,245,255,'+(.7*a).toFixed(3)+')'; ctx.lineWidth=2; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(x-70,y-16); ctx.lineTo(x,y); ctx.stroke();
        ctx.fillStyle='rgba(235,245,255,.8)';
        ctx.beginPath(); ctx.moveTo(x+7,y+2); ctx.lineTo(x-5,y-4); ctx.lineTo(x-3,y+5); ctx.closePath(); ctx.fill();
      }else if(s.k==='shock'){
        /* 架子鼓：一圈从中心荡开的震波 */
        const rr=coreR*.6+p*orbitR*1.6;
        ctx.strokeStyle=hexA(theme.accent,.5*a); ctx.lineWidth=3*(1-p)+.6;
        ctx.beginPath(); ctx.arc(cx,cy,rr,0,TAU); ctx.stroke();
      }
      ctx.restore();
    }
  }

  /* =========================================================
     通用随机趣味 + 插针联动：每次插针溅一点主题色光屑，
     偶尔一颗浮光；箭靶掠过破空箭影，架子鼓荡一圈震波
     ========================================================= */
  function spawnHitSpark(){
    const n=3+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){ const ang=Math.random()*TAU;
      sparks.push({k:'mote',x:cx,y:cy+ringR(),vx:Math.cos(ang)*rnd(18,60),
        vy:Math.sin(ang)*rnd(18,60)-18,t:0,life:rnd(.7,1.25),r:rnd(.9,2.3)}); }
    if(theme.key==='target') sparks.push({k:'arrow',t:0,life:.42,r:1});
    if(theme.key==='drum') sparks.push({k:'shock',t:0,life:.5,r:1});
  }
  function updateSparks(dt){
    if(state==='play'&&Math.random()<dt*.32)
      sparks.push({k:'glimmer',x:Math.random()*W,y:rnd(H*.12,H*.72),t:0,life:rnd(.9,1.7),r:rnd(1.6,3.4)});
    for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.t+=dt;
      if(s.k==='mote'){ s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=26*dt; }
      if(s.t>=s.life) sparks.splice(i,1); }
    if(sparks.length>90) sparks.splice(0,sparks.length-90);
  }

  /* =========================================================
     流程
     ========================================================= */
  let failStreak=0;
  /* 星链多了，环也跟着长大一点点：同样多根针也不至于挤死 */
  function ringR(){
    const extra=Math.max(0,pins.length-6);
    return coreR+pinLen*(1+extra*.026);
  }
  function hitTh(){
    return 2*Math.asin(clamp((ballR*1.45+.5)/(2*ringR()),0,.92));
  }
  function hintText(){
    return '<b>第 '+level+' / '+TOTAL_LEVELS+' 关 · '+theme.name+'</b> · 还剩 '+remaining+' 根';
  }
  /* 每关通关后有多大概率被打回第 1 关：越往后越大，第 50 关因此很难走到 */
  function loopChance(lv){
    const t=lv/TOTAL_LEVELS;
    return .028+Math.pow(t,1.8)*.17;
  }
  function doubleChance(){
    return Math.min(.1,.035+pins.length*.0022);
  }
  function setupLevel(){
    theme=forcedTheme||pendingTheme||pickTheme();
    pendingTheme=null;
    lastTheme=THEMES.indexOf(theme);
    pins=[]; flying=null; particles=[]; ripples=[];
    fails=[]; sparks=[]; hitGlow=0; scene=[];
    rotation=0; T=0; spin=0;
    /* 50 关慢慢变难：针数 4→20，转速 0.72→1.28，最后一关是硬仗 */
    const t=(level-1)/(TOTAL_LEVELS-1);
    remaining=4+Math.round(Math.pow(t,1.1)*16);
    speed=.72+t*.56;
    /* 同一关连着撞几次，就把转速收回来一点——卡关不该变成酷刑 */
    speed*=Math.max(.82,1-failStreak*.06);
    dir=(level>2&&Math.random()<Math.min(.5,.14+level*.008))?-1:1;
    /* 动态转速：两路不同频率的呼吸，每关相位都不同 */
    beatA=Math.random()*TAU; beatB=Math.random()*TAU;
    /* 每关换一个调、随机一种小氛围；关与关之间听感也不同 */
    musicRoot=196*Math.pow(2,Math.floor(Math.random()*5)/12);
    musicStep=0; musicT=0;
    combo=0; corePulse=0;
    comet=Math.random()<.55?{x:-90,y:rnd(H*.08,H*.62),vx:rnd(190,300),
      vy:rnd(-24,24),life:1,len:rnd(60,130)}:null;
    /* 转到一半又逆时针：第 6 关起，最多埋 4 个换向点 */
    const nTurns=level<6?0:Math.min(4,1+Math.floor(level/14));
    turns=[];
    for(let i=0;i<nTurns;i++){
      turns.push({at:(i+1)/(nTurns+1)*remaining+rnd(-.6,.6),done:false});
    }
    updateHUD();
    elHint.innerHTML=hintText();
  }
  function updateHUD(){
    elLv.textContent=level; elSc.textContent=score; elLc.textContent=cycle;
  }
  function showInterlude(kicker,title,sub,faint){
    interlude.className='interlude'+(faint?' faint':'');
    ilKicker.textContent=kicker; ilTitle.textContent=title; ilSub.textContent=sub;
    interlude.classList.add('show');

  function showQuoteInterlude(kicker,q){

    interlude.classList.add('show');
  }
  function hideInterlude(){ interlude.classList.remove('show'); }
  function showBonus(what){
    /* 传数组＝随机挑一句；传字符串＝就显示这句；不传＝低概率冒一句淡淡的 */
    let txt;
    if(Array.isArray(what)) txt=what[Math.floor(Math.random()*what.length)];
    else if(typeof what==='string') txt=what;
    else{
      if(Math.random()>.07) return;
      txt=['刚好','稳','轻轻一下','接住了','嗯'][Math.floor(Math.random()*5)];
    }
    bonusEl.innerHTML='✦ '+txt;
    bonusEl.classList.remove('show');
    void bonusEl.offsetWidth;
    bonusEl.classList.add('show');
  }
  /* ---------- 菜单 / 轮回记录 ---------- */
  let menuOpen=false;
  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function openMenu(){
    menuOpen=true;

    menuSub.textContent='已走过 '+Math.max(0,cycle-1)+' 次轮回'+(loops.length?' · 记下 '+loops.length+' 条':'');

    menuOpen=false;
    menuSheet.classList.remove('show');

  }
  /* 轮回刻度轴：拖动滑块翻到任意一次轮回，滚动列表也反向带动滑块 */
  let railBound=false, railDrag=false, railN=0, railData=[];
  function railRange(){ return Math.max(1,logRail.clientHeight-24); }
  function railIdxFromY(clientY){
    const r=logRail.getBoundingClientRect();
    const t=clamp((clientY-r.top-12)/Math.max(1,r.height-24),0,1);
    return railN<=1?0:Math.round(t*(railN-1));
  }
  function railGo(idx,scroll){
    if(railN<1) return;
    idx=clamp(idx,0,railN-1);
    const t=railN<=1?0:idx/(railN-1), y=12+t*railRange();
    railThumb.style.top=y+'px'; railTip.style.top=y+'px';
    const ticks=railTicks.children;
    for(let i=0;i<ticks.length;i++) ticks[i].classList.toggle('on',i===idx);
    const items=logList.querySelectorAll('.logitem');
    for(let i=0;i<items.length;i++) items[i].classList.toggle('active',i===idx);
    const d=railData[idx];
    if(d) railTip.textContent='第 '+(d.n||1)+' 次 · 止于第 '+(d.lv||1)+' 关';
    if(scroll&&items[idx]){
      const top=items[idx].offsetTop-logList.clientHeight/2+items[idx].offsetHeight/2;
      logList.scrollTo({top:clamp(top,0,Math.max(0,logList.scrollHeight-logList.clientHeight)),behavior:'smooth'});
    }
  }
  function railBind(){
    if(railBound) return; railBound=true;
    logRail.addEventListener('pointerdown',function(e){
      if(railN<1) return;
      railDrag=true; logRail.classList.add('dragging');
      try{ logRail.setPointerCapture(e.pointerId); }catch(err){}
      railGo(railIdxFromY(e.clientY),true);
      e.preventDefault();
    });
    logRail.addEventListener('pointermove',function(e){ if(railDrag) railGo(railIdxFromY(e.clientY),true); });
    const up=function(){ railDrag=false; logRail.classList.remove('dragging'); };
    logRail.addEventListener('pointerup',up);
    logRail.addEventListener('pointercancel',up);
    logList.addEventListener('scroll',function(){
      if(railDrag||railN<2) return;
      const items=logList.querySelectorAll('.logitem');
      const mid=logList.scrollTop+logList.clientHeight/2;
      let best=0,bd=1e9;
      for(let i=0;i<items.length;i++){
        const d=Math.abs(items[i].offsetTop+items[i].offsetHeight/2-mid);
        if(d<bd){ bd=d; best=i; }
      }
      railGo(best,false);
    });
  }
  function railSetup(v){
    railData=v; railN=v.length;
    logRail.classList.toggle('empty',railN===0);
    railTicks.innerHTML=railN
      ? v.map(function(_,i){ return '<div class="railTick" style="top:'+(railN<=1?0:i/(railN-1)*100)+'%"></div>'; }).join('')
      : '';
    railBind();
    requestAnimationFrame(function(){ railGo(0,false); });
  }
  function renderLogs(){
    const v=loadLogs();
    logSub.textContent=v.length?('共 '+v.length+' 次 · 从最近的一次往前'):'还没有轮回过';
    if(!v.length){
      logList.innerHTML='<div class="logempty">还没有被送回过起点。<br>多走几关，就会记下来。</div>';
      railSetup(v);
      return;
    }
    logList.innerHTML=v.map(function(x){
      const head='<div class="lh"><span class="ln">第 '+(x.n||1)+' 次轮回</span>'+
        (x.top?'<span class="ltop">走到尽头</span>':'')+
        '<span class="ll">止于第 '+(x.lv||1)+' 关 · '+(x.th||'')+'</span></div>';
      const body=x.t
        ? '<p class="lq">「'+esc(x.t)+'」</p><span class="lf">—— '+esc(x.f||'')+'</span>'
        : '<p class="lnone">这一次没有留下句子，只是静静地回去了。</p>';
      return '<div class="logitem">'+head+body+'</div>';
    }).join('');
    railSetup(v);
  }

  /* 独立链接里自己就是入口（路径不含 pin.html）：返回＝回到这一页的开场面板 */
  const SOLO=!/pin\.html/i.test(location.pathname);
  const MAIN_HUB='https://wbapp-cz6nejbdtlwos6h3o6i0wb.app.workbuddy.host/?sharecode=XNROSNXNQQ';
  const START_TITLE='不知道下一关是什么';
  const START_DESC='圆会换，风也会忽然反过来。<br>快慢说不准，偶尔一次两支。<br>有时候一句话浮上来，有时候什么都没有。又回到第一关了。';
  function backHome(){
    saveCycle();
    if(SOLO){
      hideInterlude(); state='menu';
      showOverlay(START_TITLE,START_DESC,
        cycle>1?'已走过 '+cycle+' 次轮回':'','继续玩');
      return;
    }
    const sc=new URLSearchParams(location.search).get('sharecode');
    location.href='index.html'+(sc?'?sharecode='+encodeURIComponent(sc):'');
  }
  function showOverlay(title,desc,scoreText,btnText,secondText){
    ovTitle.textContent=title;
    ovDesc.innerHTML=desc;
    if(scoreText){ ovScore.textContent=scoreText; ovScore.hidden=false; }
    else ovScore.hidden=true;
    btn.textContent=btnText;
    if(secondText){ btn2.textContent=secondText; btn2.classList.remove('hide'); btn2.dataset.act='1'; }
    else { btn2.classList.add('hide'); btn2.dataset.act=''; }
    overlay.classList.remove('hidden');
    elHint.style.opacity='0';
  }
  function hideOverlay(){
    overlay.classList.add('hidden');
    elHint.style.opacity='1';
  }
  function startLevel(lv){
    if(endTimer){ clearTimeout(endTimer); endTimer=null; }
    hideInterlude();
    level=lv; setupLevel(); state='play'; hideOverlay();
    sfx('start');
  }
  function startGame(){
    /* 轮回数是跨次累计的，重新开局不清零 */
    score=0; flash=0; shake=0; failStreak=0;
    startLevel(1);
  }
  function fire(){
    if(flying||remaining<=0) return;
    /* 偶尔一箭双雕：点一下发出两根，右上角即时给个惊喜 */
    const dbl=remaining>=2&&Math.random()<doubleChance();
    remaining-=dbl?2:1;
    flying={y:launchY,from:launchY,to:cy+ringR(),t:0,dur:dbl?.14:.1,double:dbl};
    sfx('shoot');
    if(dbl){
      showBonus(['一箭双雕 ×2','一石二鸟 ×2','双落 ×2','一次两根 ×2']);
      tone(760,.09,'sine',.04);
      setTimeout(()=>tone(1140,.13,'sine',.04),70);
    }
    elHint.innerHTML=hintText();
  }
  function land(){
    const th=hitTh(), y=flying.y, dbl=flying.double;
    let hit=false;
    for(let i=0;i<pins.length;i++){
      if(Math.abs(norm(pins[i].angle+rotation-Math.PI/2))<th){ hit=true; break; }
    }
    flying=null;
    if(hit){ gameOver(y); return; }
    pins.push({angle:Math.PI/2-rotation,n:pins.length+1,seed:Math.random()});
    if(dbl) pins.push({angle:Math.PI/2-rotation+.46,n:pins.length+1,seed:Math.random()});
    score+=dbl?20:10; totalRounds++;
    /* 插中一下，中心物件跟着心跳一下：画和声音是联动的 */
    corePulse=1;
    combo=(T-lastLandT<1.5)?combo+1:1; lastLandT=T;
    addRipple();
    spawn(cx,cy+ringR(),theme.accent,dbl?16:10,dbl?1.4:1.05);
    hitGlow=1; spawnHitSpark();
    sfx(pins.length);
    timbreHit(hitKind(),pins.length);
    hitVoice(pins.length);
    if(combo>=3&&combo%3===0){ sfx('combo'); showBonus('连 ×'+combo); }
    else if(!dbl) showBonus();
    vibrate(dbl?[8,30,8]:8);
    updateHUD();
    if(remaining<=0) levelClear();
  }
  function gameOver(y){
    failStreak++; combo=0;
    state='over'; shake=10; flash=.55;
    triggerFail(cx,y);
    sfx('fail'); vibrate([40,50,90]);
    updateHUD();
    endTimer=setTimeout(()=>{
      showOverlay('差一点 · 第 '+level+' 关',
        '再试一次就好。它时快时慢，中途还会换个方向。',
        '本局 '+score+' 分 · 第 '+cycle+' 次轮回',
        '再试这一关','回到第 1 关');
    },640);
  }
  function levelClear(){
    failStreak=0;
    state='clear';
    score+=100+level*20;
    for(let i=0;i<4;i++){
      setTimeout(()=>spawn(cx+rnd(-W*.25,W*.25),cy+rnd(-H*.15,H*.15),theme.accent,14,1.6),i*90);
    }
    sfx('win'); vibrate([20,40,20]);
    updateHUD();
    /* 每关通关都有概率被轻轻打回第 1 关；走到第 50 关必定轮回 */
    const reachedTop=level>=TOTAL_LEVELS;
    const isLoop=reachedTop||forceLoop||Math.random()<loopChance(level);
    const nextLv=isLoop?1:level+1;
    pendingTheme=pickTheme();
    const quote=QUOTES[Math.floor(Math.random()*QUOTES.length)];
    const showQuote=isLoop&&!forceNoQuote&&(reachedTop||forceQuote||Math.random()<.7);
    let hold=1500;
    if(isLoop) sfx('loop');
    if(isLoop){
      if(showQuote){
        hold=3400;
        showQuoteInterlude(reachedTop?'第 '+(cycle+1)+' 次轮回 · 走到尽头':'第 '+(cycle+1)+' 次轮回',quote);
      }else{
        hold=1200;
        showInterlude('轮回','又回到最开始','',true);
      }
    }else{
      showInterlude('第 '+level+' / '+TOTAL_LEVELS+' 关通过','下一关 · '+pendingTheme.name,'针会更多，风向也会变');
    }
    /* 把这一次轮回记下来：第几次、止步第几关、有没有留下一句话 */
    if(isLoop){
      pushLog({ n:cycle, lv:level, top:reachedTop,
        t:showQuote?quote.t:'', f:showQuote?quote.f:'',
        th:theme.name, d:Date.now() });
    }
    endTimer=setTimeout(()=>{
      if(isLoop){ cycle++; saveCycle(); }
      startLevel(nextLv);
    },hold);
  }

  /* ---------- 更新 ---------- */
  function update(dt){
    T+=dt;
    if(shake>0) shake=Math.max(0,shake-dt*42);
    if(flash>0) flash=Math.max(0,flash-dt*2.2);
    if(corePulse>0) corePulse=Math.max(0,corePulse-dt*3.4);
    if(hitGlow>0) hitGlow=Math.max(0,hitGlow-dt*2.4);
    ambientTick(dt);
    updateFails(dt);
    updateSparks(dt);
    if(comet){
      comet.x+=comet.vx*dt; comet.y+=comet.vy*dt; comet.life-=dt*.16;
      if(comet.x>W+140||comet.life<=0) comet=null;
    }
    musicTick(dt);
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt; p.vx*=.985; p.life-=dt*1.35;
      if(p.life<=0) particles.splice(i,1);
    }
    for(let i=ripples.length-1;i>=0;i--){
      const r=ripples[i];
      r.r+=(150+50*(1-r.life))*dt;
      r.life-=dt*.78;
      if(r.life<=0) ripples.splice(i,1);
    }
    for(const a of amb){
      a.y+=a.v*dt; a.x+=Math.sin(T*.6+a.p)*8*dt;
      if(a.y>H+8){ a.y=-8; a.x=Math.random()*W; }
    }
    if(state==='play'&&!menuOpen){
      /* 针变密之后悄悄减速，让最后几根还有得插 */
      const th=hitTh();
      const blocked=pins.length*th*2/TAU;
      const crowd=clamp(1-blocked*.45,.68,1);
      /* 转速不是恒定的：两路不同频率的呼吸叠在一起，时快时慢 */
      const beat=1+.20*Math.sin(T*1.6+beatA)+.10*Math.sin(T*.47+beatB);
      /* 转到一半又逆时针；速度平滑穿过 0，不会生硬地跳一下 */
      for(const tn of turns){
        if(!tn.done&&pins.length>=tn.at){
          tn.done=true; dir*=-1; sfx('turn'); addRipple();
        }
      }
      const target=dir*speed*crowd*beat;
      spin+=(target-spin)*Math.min(1,dt*4.2);
      rotation+=spin*dt;
      if(flying){
        flying.t+=dt/flying.dur;
        const p=Math.min(1,flying.t), e=1-Math.pow(1-p,2.2);
        flying.y=flying.from+(flying.to-flying.from)*e;
        if(p>=1) land();
      }
    }
  }

  /* ---------- 绘制 ---------- */
  function draw(){
    const bg=ctx.createRadialGradient(cx,cy*.9,10,cx,H*.55,Math.max(W,H)*.9);
    bg.addColorStop(0,theme.bg[0]); bg.addColorStop(.5,theme.bg[1]); bg.addColorStop(1,theme.bg[2]);
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    /* 主题场景背层：雨丝、雪、彩带、尾羽、烟雾、涟漪、萤火（确定性，不闪） */
    drawSceneBack();

    /* 星点 */
    for(const s of stars){
      const al=.12+.24*(.5+.5*Math.sin(T*s.s+s.p));
      ctx.fillStyle='rgba(210,222,255,'+al.toFixed(3)+')';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
    }
    /* 环境小物，每个主题不一样 */
    for(const a of amb){
      ctx.globalAlpha=a.a;
      if(theme.key==='music'){
        ctx.fillStyle=theme.accent; ctx.fillRect(a.x,a.y,a.r,a.r*1.8);
        ctx.fillRect(a.x+a.r,a.y-2,a.r*.8,a.r*.8);
      }else if(theme.key==='plant'||theme.key==='dessert'||theme.key==='hoop'){
        ctx.fillStyle=theme.accent;
        ctx.beginPath(); ctx.ellipse(a.x,a.y,a.r,a.r*.55,Math.sin(a.p)*1.2,0,TAU); ctx.fill();
      }else if(theme.key==='beach'){
        ctx.fillStyle='rgba(200,240,255,.9)';
        ctx.beginPath(); ctx.arc(a.x,a.y,a.r*.5,0,TAU); ctx.fill();
      }else if(theme.key==='yarn'){
        ctx.strokeStyle=theme.accent; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,TAU); ctx.stroke();
      }else if(theme.key==='rain'){
        ctx.strokeStyle='rgba(190,225,255,.75)'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x-2,a.y+a.r*3); ctx.stroke();
      }else if(theme.key==='radar'||theme.key==='target'||theme.key==='watch'){
        ctx.strokeStyle=theme.accent; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(a.x,a.y,a.r*.8,0,TAU); ctx.stroke();
      }else if(theme.key==='harvest'||theme.key==='carousel'||
               theme.key==='zen'||theme.key==='wheel'){
        ctx.fillStyle=theme.accent;
        ctx.beginPath(); ctx.ellipse(a.x,a.y,a.r*.5,a.r*1.1,.4,0,TAU); ctx.fill();
      }else if(theme.amb==='bubble'){
        ctx.strokeStyle=hexA(theme.accent,.8); ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(a.x,a.y,a.r*.8,0,TAU); ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,.35)';
        ctx.beginPath(); ctx.arc(a.x-a.r*.25,a.y-a.r*.25,a.r*.2,0,TAU); ctx.fill();
      }else if(theme.amb==='streak'){
        ctx.strokeStyle=hexA(theme.accent,.7); ctx.lineWidth=1.2; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x+1.5,a.y+a.r*2.6); ctx.stroke();
      }else if(theme.amb==='fluff'){
        ctx.strokeStyle=hexA(theme.accent,.7); ctx.lineWidth=.9;
        for(let k=-1;k<=1;k++){
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x+k*3,a.y-a.r*1.6); ctx.stroke();
        }
      }else if(theme.amb==='dot'){
        ctx.fillStyle=theme.accent;
        ctx.beginPath(); ctx.arc(a.x,a.y,a.r*.45,0,TAU); ctx.fill();
      }else{
        ctx.fillStyle='rgba(220,230,255,.9)';
        ctx.beginPath(); ctx.arc(a.x,a.y,a.r*.5,0,TAU); ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    /* 偶尔一条光带斜着掠过，跟着主题色，纯氛围 */
    if(comet){
      ctx.save(); ctx.globalAlpha=clamp(comet.life,0,1)*.6;
      const tg=ctx.createLinearGradient(comet.x-comet.len,comet.y,comet.x,comet.y);
      tg.addColorStop(0,hexA(theme.accent,0)); tg.addColorStop(1,hexA(theme.accent,.9));
      ctx.strokeStyle=tg; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(comet.x-comet.len,comet.y-comet.vy/comet.vx*comet.len);
      ctx.lineTo(comet.x,comet.y); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.8)';
      ctx.beginPath(); ctx.arc(comet.x,comet.y,2,0,TAU); ctx.fill();
      ctx.restore();
    }

    ctx.save();
    if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

    /* 中心的氛围光：插中时跟着心跳亮一下 */
    const halo=ctx.createRadialGradient(cx,cy,coreR*.4,cx,cy,orbitR*2.2);
    halo.addColorStop(0,hexA(theme.accent,.16+corePulse*.13+hitGlow*.06));
    halo.addColorStop(1,hexA(theme.accent,0));
    ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(cx,cy,orbitR*2.2,0,TAU); ctx.fill();

    /* 涟漪在链子底下，才不会糊住星；散粉/唇印留到中心物件之后再画 */
    for(const rp of ripples) if(!rp.onTop) drawRipple(rp);

    /* 发射基线 */
    ctx.strokeStyle='rgba(170,186,230,.16)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx-Math.min(W*.28,120),launchY); ctx.lineTo(cx+Math.min(W*.28,120),launchY); ctx.stroke();
    /* 落点提示：一个小小的凹口，告诉你球会打在哪 */
    ctx.strokeStyle=hexA(theme.accent,.5); ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(cx,cy,ringR()+.5,Math.PI/2-.12,Math.PI/2+.12); ctx.stroke();

    /* 已经插上的针：异形杆 + 针头，统一在「圆心朝外」的局部坐标里画 */
    const u=Math.max(1,ballR/6.6);
    for(const p of pins){
      const a=p.angle+rotation, rr=ringR();
      const sx=cx+Math.cos(a)*coreR*.94, sy=cy+Math.sin(a)*coreR*.94;
      const L=rr-coreR*.94;
      ctx.save();
      ctx.translate(sx,sy); ctx.rotate(a);
      if(theme.stem){
        /* 异形针统一把侧向弯曲放大一点，别让它们看着还是一根直线 */
        ctx.save(); ctx.scale(1,1.55); theme.stem(L,p.seed||0); ctx.restore();
      } else stemStraight(L,theme.key==='cosmos');
      ctx.translate(L,0); ctx.rotate(Math.PI/2); ctx.scale(u,u);
      theme.pin();
      ctx.restore();
    }

    /* 中心物件 */
    withCore((R,t)=>{ t.core(R,t); });
    /* 物件上压一层主题色的薄光，跟背景连成一体 */
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const top=ctx.createRadialGradient(cx,cy-coreR*.4,coreR*.2,cx,cy,coreR*1.1);
    top.addColorStop(0,hexA(theme.accent,.10));
    top.addColorStop(1,hexA(theme.accent,0));
    ctx.fillStyle=top; ctx.beginPath(); ctx.arc(cx,cy,coreR*1.15,0,TAU); ctx.fill();
    ctx.restore();

    /* 从圆中间向四周泛开的两款插中效果，盖在物件之上才看得见 */
    for(const rp of ripples) if(rp.onTop) drawRipple(rp);

    /* 飞行中的针（一箭双雕时是并排两支） */
    if(flying){
      const offs=flying.double?[-ballR*.95,ballR*.95]:[0];
      for(const off of offs){
        const fx=cx+off;
        const trail=ctx.createLinearGradient(fx,flying.y+ballR*4,fx,flying.y);
        trail.addColorStop(0,hexA(theme.accent,0));
        trail.addColorStop(1,hexA(theme.accent,.55));
        ctx.strokeStyle=trail; ctx.lineWidth=ballR*1.1; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(fx,flying.y+ballR*3.6); ctx.lineTo(fx,flying.y+ballR*.6); ctx.stroke();
        ctx.save();
        ctx.translate(fx,flying.y); ctx.rotate(Math.PI); ctx.scale(u,u);
        theme.pin();
        ctx.restore();
      }
    }

    /* 待发队列 */
    if(state==='play'||state==='menu'){
      const show=Math.min(remaining,9), gap=ballR*2.6, qy=launchY+Math.max(34,ballR*3.6);
      const total=(show-1)*gap, startX=cx-total/2;
      for(let i=0;i<show;i++){
        const isNext=(i===0&&!flying);
        const pulse=isNext?1+.12*Math.sin(T*5):1;
        drawStar(startX+i*gap,qy,ballR*.86*pulse,isNext?1:.45,isNext?'#ffffff':theme.accent,isNext?12:0);
      }
      if(remaining>show){
        ctx.fillStyle='rgba(200,212,245,.7)'; ctx.textAlign='left'; ctx.textBaseline='middle';
        ctx.font='600 12px system-ui,sans-serif';
        ctx.fillText('×'+remaining,startX+total+ballR*2.9,qy);
      }
    }

    /* 撞针失败特效与通用光屑：盖在物件之上、跟着屏幕轻抖 */
    for(const f of fails) drawFail(f);
    drawSparks();

    /* 粒子 */
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.restore();

    /* 屏幕级：朦胧玻璃雨滴、光束粉雾、边缘积雪，贴在玻璃上 */
    drawSceneFront();

    if(flash>0){
      ctx.fillStyle='rgba(255,90,110,'+(flash*.2).toFixed(3)+')';
      ctx.fillRect(0,0,W,H);
    }
  }

  function hexA(hex,a){
    const n=parseInt(hex.slice(1),16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }

  /* ---------- 主循环 ---------- */
  let last=0;
  function loop(t){
    const dt=Math.min(.033,(t-last)/1000||0); last=t;
    if(!document.hidden){ update(dt); draw(); }
    requestAnimationFrame(loop);
  }

  /* ---------- 输入 ---------- */
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault(); ensureAudio();
    if(state==='play'&&!menuOpen) fire();
  },{passive:false});
  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
  btn.addEventListener('click',function(e){
    e.preventDefault(); ensureAudio();
    if(state==='over') startLevel(level);
    else if(state!=='clear') startGame();
  });
  btn2.addEventListener('click',function(e){
    e.preventDefault(); ensureAudio();
    if(btn2.dataset.act) startLevel(1);
  });
  homeBtn.addEventListener('click',function(e){
    e.stopPropagation(); e.preventDefault(); ensureAudio(); openMenu();
  });
  btnHome.addEventListener('click',function(e){
    e.preventDefault();
    if(SOLO){ saveCycle(); location.href=MAIN_HUB+'&cycle='+cycle; }
    else backHome();
  });
  $('mBack').addEventListener('click',function(e){
    e.preventDefault(); closeMenu();
    if(SOLO){ saveCycle(); location.href=MAIN_HUB+'&cycle='+cycle; }
    else backHome();
  });
  $('mLog').addEventListener('click',function(e){
    e.preventDefault(); renderLogs();
    menuSheet.classList.remove('show');
    logSheet.classList.add('show');
  });
  $('mResume').addEventListener('click',function(e){ e.preventDefault(); closeMenu(); });
  $('mClose').addEventListener('click',function(e){ e.preventDefault(); closeMenu(); });
  $('logBack').addEventListener('click',function(e){
    e.preventDefault(); logSheet.classList.remove('show'); menuSheet.classList.add('show');
  });
  logSheet.addEventListener('click',function(e){ if(e.target===logSheet) closeMenu(); });
  menuSheet.addEventListener('click',function(e){ if(e.target===menuSheet) closeMenu(); });
  muteBtn.addEventListener('click',function(e){
    e.stopPropagation(); e.preventDefault();
    muted=!muted;
    muteBtn.textContent=muted?'🔇':'🔊';
    if(!muted){ ensureAudio(); tone(660,.1,'sine',.04); }
  });
  document.addEventListener('keydown',function(e){
    if(e.code==='Escape'){ if(menuOpen){ e.preventDefault(); closeMenu(); } return; }
    if(e.code==='Space'||e.code==='Enter'){
      e.preventDefault(); ensureAudio();
      if(menuOpen) return;
      if(state==='play') fire();
      else if(state==='over') startLevel(level);
      else if(state!=='clear') startGame();
    }
  });
  document.addEventListener('visibilitychange',()=>{ last=performance.now(); });

  /* ---------- 启动（调试参数：?lv=8&theme=radar&pre=6&loop=1&quote=1） ---------- */
  resize();
  const qs=new URLSearchParams(location.search);
  forceLoop=qs.get('loop')==='1';
  forceQuote=qs.get('quote')==='1';
  forceNoQuote=qs.get('quote')==='0';
  const dbgLv=parseInt(qs.get('lv')||'0',10);
  const dbgTh=qs.get('theme');
  if(dbgLv){
    if(dbgTh){ const t=THEMES.find(x=>x.key===dbgTh); if(t) forcedTheme=t; }
    level=dbgLv; score=(dbgLv-1)*120;
    setupLevel();
    state='play'; hideOverlay();
    elHint.innerHTML=hintText();
    if(qs.get('ripple')) setInterval(addRipple,700);   /* 调试用：看涟漪 */
    const pre=parseInt(qs.get('pre')||'0',10);
    for(let i=0;i<pre;i++){
      pins.push({angle:Math.PI/2-rotation+i*(TAU/pre)+.12,n:i+1,seed:Math.random()});
    }
  }else{
    showOverlay(START_TITLE,START_DESC,
      cycle>1?'已走过 '+cycle+' 次轮回':'',SOLO?'进入星环':'开始游戏');
    if(SOLO){
      btnHome.textContent='← 回到我的像素小世界';
      homeBtn.title='菜单';
    }
  }
  /* 只在 ?dbg=1 时挂一个只读探针，方便体检换向 / 双发 / 轮回 */
  if(qs.get('dbg')==='1'){
    window.__dbg=function(){
      return {level:level,cycle:cycle,remaining:remaining,dir:dir,spin:spin,speed:speed,
        state:state,pins:pins.length,turns:turns.map(function(t){return {at:t.at,done:t.done};}),
        combo:combo,corePulse:+corePulse.toFixed(2),comet:!!comet,musicRoot:musicRoot,
        bonus:bonusEl.className,quote:interlude.className,quoteText:ilTitle.textContent,
        quoteFrom:ilSub.textContent,themes:THEMES.length,quotes:QUOTES.length,
        logs:loadLogs().length,menuOpen:menuOpen,
        hitKind:hitKind(),fails:fails.map(function(f){return f.kind;}),sparks:sparks.length,
        themeKey:theme.key,lastVoice:lastVoice,hitVoices:HIT_VOICE_NAMES.length,
        railN:railN,activeLog:(function(){const a=logList.querySelector('.logitem.active');
          return a?a.querySelector('.ln').textContent:'';})(),
        railTip:railTip.textContent,ovTitle:ovTitle.textContent};
    };
  }
  /* 调试：?logs=N 塞 N 条轮回记录，用来体检右侧刻度轴拖动 */
  if(qs.get('logs')){
    const n=parseInt(qs.get('logs'),10)||8, fake=[];
    for(let i=0;i<n;i++) fake.push({n:i+1,lv:3+(i*7)%20,top:i===n-1,
      th:['雨天','雪夜','星轨','深潜水母','蒲公英'][i%5],
      t:i%3===0?'':'我崇拜流浪、变化和幻想，不愿将我的爱钉在地球某处。',
      f:i%3===0?'':'赫尔曼·黑塞《克林索尔的最后夏天》',d:Date.now()-i*90000});
    try{ localStorage.setItem(LOG_KEY,JSON.stringify(fake)); }catch(e){}
  }
  /* 调试：?failkind=xxx 强制一种撞针特效，?fail=1 连续刷，用来体检每一种 */
  if(qs.get('fail')==='1'){
    const fk=qs.get('failkind');
    const fire=function(){
      fails=[];
      if(fk){ const parts=[],N=18;
        for(let i=0;i<N;i++) parts.push({a:Math.random()*TAU,sp:rnd(26,96),r:rnd(1.1,3.6),
          p:Math.random()*TAU,g:rnd(-1,1),t:Math.random(),rot:rnd(-3,3)});
        fails.push({kind:fk,x:cx,y:cy+ringR(),t:0,life:1.4,seed:1.2,parts:parts,col:theme.accent});
      }else triggerFail(cx,cy+ringR());
    };
    fire(); setInterval(fire,1500);
  }
  if(qs.get('win')==='1') setTimeout(levelClear,60);   /* 调试：直接走一次通关流程 */
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
