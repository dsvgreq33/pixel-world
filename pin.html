<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e24">
<title>星环 · 见缝插针</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e24;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#eef1ff}
  #cv{display:block;position:absolute;inset:0;width:100%;height:100%}

  .hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:10px;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 0 16px;pointer-events:none;z-index:3}
  .stat{flex:1;min-width:0;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);
    border-radius:14px;padding:8px 10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .stat span{display:block;font-size:10px;letter-spacing:2px;color:#9aa6d8;margin-bottom:2px}
  .stat b{display:block;font-size:20px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .tools{flex:0 0 auto;display:flex;gap:8px}
  #mute,#home{pointer-events:auto;flex:0 0 auto;width:42px;height:42px;border-radius:13px;cursor:pointer;
    border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.055);color:#dfe5ff;
    font-size:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #home{font-size:17px;line-height:1}
  #mute:active,#home:active{transform:scale(.93)}

  /* 菜单 / 轮回记录：跟入口一样的玻璃气泡，压在游戏之上 */
  .sheet{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
    padding:22px;background:rgba(7,9,26,.76);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility .25s ease}
  .sheet.show{opacity:1;visibility:visible;pointer-events:auto}
  .glass{width:100%;max-width:350px;max-height:82vh;display:flex;flex-direction:column;
    padding:22px 20px 18px;border-radius:26px;
    background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,.035) 48%,rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.2);
    -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -14px 26px rgba(255,255,255,.04),
      0 22px 50px rgba(0,0,0,.45)}
  .glass .kicker{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:9px;
    letter-spacing:.3em;color:rgba(200,212,255,.6);margin-bottom:6px}
  .glass h3{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:.5px;color:#fff}
  .glass .sub{font-size:11.5px;line-height:1.7;color:rgba(215,224,255,.62);margin:0 0 16px}
  .mitem{display:flex;align-items:center;gap:11px;width:100%;padding:13px 14px;margin-bottom:9px;
    border-radius:16px;cursor:pointer;text-align:left;font:inherit;font-size:13.5px;font-weight:600;
    color:#eef2ff;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.16);
    transition:background .18s ease,transform .18s ease}
  .mitem:active{transform:scale(.985);background:rgba(255,255,255,.14)}
  .mitem .ico{font-size:17px;width:22px;text-align:center;flex:0 0 auto}
  .mitem .mtext{flex:1;min-width:0}
  .mitem small{display:block;font-size:10px;font-weight:400;letter-spacing:.4px;
    color:rgba(200,212,255,.55);margin-top:2px}
  .mclose{margin-top:6px;padding:10px;background:transparent;border:0;cursor:pointer;
    color:rgba(200,212,255,.65);font:inherit;font-size:12px;letter-spacing:1px}
  .mclose:active{color:#fff}
  /* 轮回记录列表 + 右侧可拖动的轮回刻度轴 */
  .logbody{display:flex;gap:12px;flex:1;min-height:0;margin:2px -4px 12px;padding:0 4px}
  .loglist{overflow-y:auto;overflow-x:hidden;flex:1;min-width:0;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(180,196,255,.3),transparent}
  .loglist::-webkit-scrollbar{width:4px}
  .loglist::-webkit-scrollbar-thumb{background:rgba(180,196,255,.3);border-radius:4px}
  .logitem.active{border-color:rgba(255,225,160,.5);background:rgba(255,225,160,.07)}
  .lograil{position:relative;flex:0 0 28px;width:28px;touch-action:none;cursor:grab;user-select:none}
  .lograil.dragging{cursor:grabbing}
  .lograil.empty{opacity:.3;pointer-events:none}
  .railLine{position:absolute;top:12px;bottom:12px;left:50%;width:2px;transform:translateX(-50%);
    background:linear-gradient(180deg,rgba(160,180,255,.4),rgba(160,180,255,.1));border-radius:2px}
  .railTicks{position:absolute;inset:12px 0;pointer-events:none}
  .railTick{position:absolute;left:50%;width:8px;height:2px;transform:translate(-50%,-50%);
    background:rgba(180,196,255,.45);border-radius:2px;transition:background .18s,width .18s}
  .railTick.on{background:#ffe1a0;width:13px;box-shadow:0 0 8px rgba(255,225,160,.55)}
  .railThumb{position:absolute;left:50%;top:12px;width:20px;height:20px;transform:translate(-50%,-50%);
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95),rgba(180,196,255,.6) 55%,rgba(140,160,240,.35));
    border:1px solid rgba(255,255,255,.72);
    box-shadow:0 2px 10px rgba(0,0,0,.35),0 0 12px rgba(160,180,255,.4)}
  .lograil.dragging .railThumb{box-shadow:0 2px 14px rgba(0,0,0,.4),0 0 20px rgba(180,200,255,.7)}
  .railTip{position:absolute;right:34px;white-space:nowrap;padding:5px 9px;border-radius:9px;
    font-size:10.5px;letter-spacing:.3px;color:#e6ecff;
    background:rgba(20,24,54,.92);border:1px solid rgba(255,255,255,.18);
    opacity:0;transition:opacity .18s;pointer-events:none;z-index:2}
  .lograil.dragging .railTip{opacity:1}
  .logitem{padding:12px 13px;margin-bottom:9px;border-radius:15px;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12)}
  .logitem .lh{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
  .logitem .ln{font-size:12.5px;font-weight:700;color:#dfe7ff}
  .logitem .ll{font-family:ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.5px;
    color:rgba(190,205,255,.6);margin-left:auto;flex:0 0 auto}
  .logitem .lq{font-family:Georgia,"Songti SC","Noto Serif SC",serif;font-size:12px;
    line-height:1.75;color:rgba(240,232,255,.9);margin:0}
  .logitem .lf{display:block;margin-top:5px;font-size:10px;letter-spacing:.3px;
    color:rgba(190,205,255,.55)}
  .logitem .lnone{font-size:11.5px;color:rgba(190,205,255,.45);font-style:italic;margin:0}
  .logitem .ltop{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;
    font-size:9px;letter-spacing:.5px;background:rgba(255,220,150,.18);color:#ffe1a0}
  .logempty{padding:26px 14px;text-align:center;font-size:12px;line-height:1.9;
    color:rgba(200,212,255,.55)}

  .hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);
    text-align:center;font-size:12px;letter-spacing:1px;color:#7f8bc2;pointer-events:none;z-index:3}
  .hint b{color:#cdd6ff;font-weight:600}

  .overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgba(7,9,26,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:opacity .28s ease,visibility .28s ease;opacity:1;visibility:visible}
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .panel{width:100%;max-width:340px;text-align:center;padding:30px 24px 24px;border-radius:26px;
    background:linear-gradient(160deg,rgba(46,54,110,.92),rgba(20,24,60,.95));
    border:1px solid rgba(160,180,255,.18);
    box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09)}
  .mark{font-size:38px;line-height:1;color:#8fa6ff;text-shadow:0 0 24px rgba(120,150,255,.9);margin-bottom:10px}
  .gameName{font-size:11px;letter-spacing:5px;color:#93a1e0;margin-bottom:14px}
  h2{margin:0 0 12px;font-size:21px;line-height:1.45;font-weight:700}
  #ovDesc{margin:0 0 18px;font-size:13px;line-height:1.85;color:#b8c2ee}
  .scoreline{margin:-4px 0 18px;font-size:14px;font-weight:600;color:#ffd98a;font-variant-numeric:tabular-nums}
  #btn{width:100%;padding:15px;border:0;border-radius:15px;cursor:pointer;font-size:16px;font-weight:700;
    color:#0d1030;background:linear-gradient(100deg,#8fb4ff,#b79bff 55%,#ff9fd0);
    box-shadow:0 10px 28px rgba(140,150,255,.35);font-family:inherit}
  #btn:active{transform:translateY(2px);box-shadow:0 5px 16px rgba(140,150,255,.3)}
  #btn2{width:100%;margin-top:10px;padding:11px;border-radius:13px;cursor:pointer;font-size:12.5px;
    color:#9fabdf;background:transparent;border:1px solid rgba(160,180,255,.22);font-family:inherit}
  #btn2.hide{display:none}
  .tip{margin:14px 0 0;font-size:11px;color:#7884bb;letter-spacing:.5px}
  .homelink{display:block;margin:10px auto 0;padding:6px 12px;background:transparent;border:0;
    color:#8e9bd0;font-size:11.5px;letter-spacing:1px;cursor:pointer;font-family:inherit}
  .homelink:active{color:#e6ecff}

  /* 过关不打断：一层很轻的过场字，自动流到下一关 */
  .interlude{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .42s ease;
    background:radial-gradient(62% 38% at 50% 50%,rgba(8,10,28,.62),transparent 72%)}
  .interlude.show{opacity:1}
  .ilInner{text-align:center;padding:0 26px;transform:translateY(8px);transition:transform .55s cubic-bezier(.2,.8,.3,1)}
  .interlude.show .ilInner{transform:translateY(0)}
  .ilKicker{font-size:10px;letter-spacing:5px;color:#9aa6d8;margin-bottom:12px}
  .ilTitle{font-size:clamp(22px,7vw,29px);font-weight:800;letter-spacing:2px;line-height:1.4;
    text-shadow:0 0 32px rgba(150,170,255,.65)}
  .ilSub{margin-top:12px;font-size:12.5px;letter-spacing:1px;color:#b8c2ee}
  /* 句子过场：比通关字更淡、更慢，像自己浮上来的 */
  .interlude.faint .ilInner{opacity:.42}
  .interlude.quote .ilInner{opacity:.86}
  .interlude.quote .ilKicker{color:#8e9bc8}
  .interlude.quote .ilTitle{font-family:Georgia,"Songti SC","Noto Serif SC",serif;
    font-weight:400;font-size:clamp(15px,4.2vw,18px);line-height:1.95;letter-spacing:.4px;
    max-width:310px;margin:0 auto;color:#e9edff}
  .interlude.quote .ilSub{margin-top:16px;font-size:11px;letter-spacing:.4px;color:#9aa6cf}
  /* 一箭双雕：右上角即时惊喜 */
  .bonus{position:absolute;top:calc(env(safe-area-inset-top) + 74px);right:16px;z-index:5;
    padding:9px 14px;border-radius:14px;pointer-events:none;opacity:0;
    background:linear-gradient(140deg,rgba(255,240,190,.22),rgba(255,200,140,.08));
    border:1px solid rgba(255,225,160,.38);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:#ffe6a8;font-size:12.5px;font-weight:700;letter-spacing:1px;
    box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35)}
  .bonus.show{animation:bonusPop 1.5s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes bonusPop{
    0%{opacity:0;transform:translateY(10px) scale(.9)}
    14%{opacity:1;transform:translateY(0) scale(1.04)}
    24%{transform:translateY(0) scale(1)}
    74%{opacity:1;transform:translateY(0)}
    100%{opacity:0;transform:translateY(-8px)}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud">
  <div class="stat"><span>关卡</span><b id="lv">1</b></div>
  <div class="stat"><span>分数</span><b id="sc">0</b></div>
  <div class="stat"><span>轮回</span><b id="lc">1</b></div>
  <div class="tools">
    <button id="home" aria-label="打开菜单" title="菜单">☰</button>
    <button id="mute" aria-label="切换音效">🔊</button>
  </div>
</div>

<div class="hint" id="hint">点屏幕任意位置发射 · 别撞到已经插上的</div>

<div class="bonus" id="bonus"></div>

<div class="interlude" id="interlude">
  <div class="ilInner">
    <div class="ilKicker" id="ilKicker">ORBIT</div>
    <div class="ilTitle" id="ilTitle"></div>
    <div class="ilSub" id="ilSub"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="mark">✦</div>
    <div class="gameName">星环 · ORBIT</div>
    <h2 id="ovTitle">不知道下一关是什么</h2>
    <p id="ovDesc">圆会换，风也会忽然反过来。<br>快慢说不准，偶尔一次两支。有时候一句话浮上来，有时候什么都没有。<br>又回到第一关了。</p>
    <div class="scoreline" id="ovScore" hidden></div>
    <button id="btn">开始游戏</button>
    <button id="btn2" class="hide">回到第 1 关</button>
    <button id="btnHome" class="homelink">← 返回入口</button>
  </div>
</div>

<div class="sheet" id="menuSheet">
  <div class="glass">
    <div class="kicker">ORBIT · MENU</div>
    <h3>星环</h3>
    <p class="sub" id="menuSub">已走过 1 次轮回</p>
    <button class="mitem" id="mBack"><span class="ico">↩</span><span class="mtext">返回入口<small id="mBackHint">回到三个入口的小世界</small></span></button>
    <button class="mitem" id="mLog"><span class="ico">✦</span><span class="mtext">轮回记录<small>看看每一次是在哪一关、留下了什么话</small></span></button>
    <button class="mitem" id="mResume"><span class="ico">▷</span><span class="mtext">继续玩<small>回到这一关</small></span></button>
    <button class="mclose" id="mClose">关闭</button>
  </div>
</div>

<div class="sheet" id="logSheet">
  <div class="glass">
    <div class="kicker">ORBIT · LOOPS</div>
    <h3>轮回记录</h3>
    <p class="sub" id="logSub">每一次被轻轻送回起点</p>
    <div class="logbody">
      <div class="loglist" id="logList"></div>
      <div class="lograil" id="logRail">
        <div class="railLine"></div>
        <div class="railTicks" id="railTicks"></div>
        <div class="railThumb" id="railThumb"></div>
        <div class="railTip" id="railTip"></div>
      </div>
    </div>
    <button class="mclose" id="logBack">← 返回菜单</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const $=id=>document.getElementById(id);
  const elLv=$('lv'), elSc=$('sc'), elLc=$('lc'), elHint=$('hint');
  const overlay=$('overlay'), btn=$('btn'), btn2=$('btn2');
  const ovTitle=$('ovTitle'), ovDesc=$('ovDesc'), ovScore=$('ovScore'), muteBtn=$('mute');
  const homeBtn=$('home'), btnHome=$('btnHome');
  const interlude=$('interlude'), ilKicker=$('ilKicker'), ilTitle=$('ilTitle'), ilSub=$('ilSub');
  const bonusEl=$('bonus');
  const menuSheet=$('menuSheet'), logSheet=$('logSheet'), logList=$('logList');
  const menuSub=$('menuSub'), logSub=$('logSub'), mBackHint=$('mBackHint');
  const logRail=$('logRail'), railTicks=$('railTicks'), railThumb=$('railThumb'), railTip=$('railTip');

  const TAU=Math.PI*2;
  const norm=a=>Math.atan2(Math.sin(a),Math.cos(a));
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
  const rnd=(a,b)=>a+Math.random()*(b-a);

  let W=0,H=0,DPR=1,cx=0,cy=0,coreR=0,pinLen=0,ballR=0,orbitR=0,launchY=0;
  let stars=[], amb=[];

  /* 只留一个数：累计轮回。关卡、分数、主题一概不存档 */
  const CYCLE_KEY='orbit_cycle_v1', LOG_KEY='orbit_loops_v1';
  /* 只记轮回的"经过"：第几次、在第几关、有没有留下一句话 */
  function loadLogs(){
    try{
      const v=JSON.parse(localStorage.getItem(LOG_KEY));
      return Array.isArray(v)?v.slice(0,80):[];
    }catch(e){ return []; }
  }
  function pushLog(rec){
    try{
      const v=loadLogs(); v.unshift(rec);
      localStorage.setItem(LOG_KEY,JSON.stringify(v.slice(0,80)));
    }catch(e){}
  }
  function loadCycle(){
    let n=1;
    try{ n=parseInt(localStorage.getItem(CYCLE_KEY),10)||1; }catch(e){}
    /* 独立链接跳回原入口时会把轮回数带在地址上，取较大的那个 */
    try{
      const fromUrl=parseInt(new URLSearchParams(location.search).get('cycle')||'0',10);
      if(fromUrl>n) n=fromUrl;
    }catch(e){}
    n=(n>0&&n<100000)?n:1;
    try{ localStorage.setItem(CYCLE_KEY,String(n)); }catch(e){}
    return n;
  }
  function saveCycle(){ try{ localStorage.setItem(CYCLE_KEY,String(cycle)); }catch(e){} }

  let state='menu';
  let level=1, score=0, cycle=loadCycle(), remaining=0, totalRounds=0;
  let rotation=0, dir=1, speed=1, T=0, spin=0, beatA=0, beatB=0;
  let pins=[], flying=null, particles=[], ripples=[], shake=0, flash=0;
  let endTimer=null, turns=[], forceLoop=false, forceQuote=false, forceNoQuote=false;
  /* 联动与随机：中心心跳、连击、偶尔掠过的光带、每关换调的轻音乐 */
  let corePulse=0, combo=0, lastLandT=0, comet=null, musicT=0, musicStep=0, musicRoot=220;
  /* 屏幕级主题氛围、撞针失败特效、通用随机小惊喜、环境音计时 */
  let scene=[], fails=[], sparks=[], ambT=0, ambGap=4, hitGlow=0;

  /* =========================================================
     主题：每一关随机挑一个，中心物件、配色、涟漪都跟着换
     ========================================================= */
  const THEMES=[
    { key:'cosmos', name:'星轨', tag:'星球', core:drawPlanet, pin:pinChain,
      bg:['#1b2050','#111538','#07091a'], accent:'#8ea6ff', ripple:'star' },
    { key:'dessert', name:'甜点', tag:'蛋糕', core:drawCake, pin:pinFork,
      bg:['#3a1f2e','#2a1420','#150a11'], accent:'#ff9fc4', ripple:'jam' },
    { key:'hoop', name:'绣绷', tag:'绣台', core:drawHoop, pin:pinNeedle,
      bg:['#232a3c','#1a2030','#0c1018'], accent:'#8fd8c0', ripple:'thread' },
    { key:'music', name:'唱片', tag:'唱盘', core:drawPlayer, pin:pinNote,
      bg:['#2a2140','#1d1730','#0c0918'], accent:'#ffd27a', ripple:'staff' },
    { key:'plant', name:'盆栽', tag:'花盆', core:drawPlant, pin:pinFlower,
      bg:['#1d2c24','#15221c','#090f0c'], accent:'#9dd67f', ripple:'petal' },
    { key:'beach', name:'沙堡', tag:'沙堡', core:drawCastle, pin:pinSpade,
      bg:['#2b3a52','#1e2a3d','#0b1018'], accent:'#ffd59c', ripple:'wave' },
    { key:'yarn', name:'毛线', tag:'毛线球', core:drawYarn, pin:pinKnit,
      bg:['#2c2238','#1e1728','#0e0a14'], accent:'#ff9db8', ripple:'yarn' },
    { key:'lantern', name:'灯会', tag:'灯笼', core:drawLantern, pin:pinLantern,
      bg:['#3a1d1d','#281414','#110808'], accent:'#ffb46b', ripple:'glow' },
    { key:'snow', name:'雪夜', tag:'雪景', core:drawSnow, pin:pinCrystal,
      bg:['#1a2634','#131c26','#070c12'], accent:'#bfe6ff', ripple:'crystal' },
    { key:'radar', name:'全息雷达', tag:'扫描盘', core:drawRadar, pin:pinProbe,
      bg:['#0e3a44','#08262f','#03131a'], accent:'#78f0d4', ripple:'scan' },
    { key:'watch', name:'怀表', tag:'表盘', core:drawWatch, pin:pinClock,
      bg:['#3a2e22','#281e17','#120c08'], accent:'#f0cf86', ripple:'tick' },
    { key:'zen', name:'枯山水', tag:'砂庭', core:drawZen, pin:pinStone,
      bg:['#3a362c','#2a271f','#14120d'], accent:'#cfc4a4', ripple:'rake' },

  let ac=null, muted=false;
  function ensureAudio(){

  function tone(freq,dur,type,vol,slide){
    if(muted) return;
    ensureAudio(); if(!ac) return;
    try{
      const o=ac.createOscillator(), g=ac.createGain(), now=ac.currentTime;
      o.type=type||'sine';
      o.frequency.setValueAtTime(freq,now);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),now+dur);
      g.gain.setValueAtTime(vol||.05,now);
      g.gain.exponentialRampToValueAtTime(.0001,now+dur);
      o.connect(g); g.connect(ac.destination);
      o.start(now); o.stop(now+dur+.02);
    }catch(e){}
  }

  function noise(dur,vol,freq,freq2){
    if(muted) return;
    ensureAudio(); if(!ac) return;
    try{
      const n=Math.max(1,Math.floor(ac.sampleRate*dur));
      const buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
      const src=ac.createBufferSource(), bp=ac.createBiquadFilter(), g=ac.createGain(), now=ac.currentTime;
      src.buffer=buf; bp.type='bandpass'; bp.frequency.setValueAtTime(freq||900,now); bp.Q.value=1.1;
      if(freq2) bp.frequency.exponentialRampToValueAtTime(Math.max(60,freq2),now+dur);
      g.gain.value=vol||.05;
      src.connect(bp); bp.connect(g); g.connect(ac.destination);
      src.start(); src.stop(now+dur+.01);
    }catch(e){}
  }

    }

    else if(kind==='raindrop'){ tone(f*2.2,.16,'sine',.026,-f*.7); noise(.05,.011,3200); }

    else if(kind==='bell'){ tone(f*2,.42,'sine',.035); tone(f*3,.3,'sine',.012); }

    else if(kind==='pluck'){ tone(f*1.2,.14,'triangle',.03,-f*.35); }

    else if(Math.random()<.5) tone(musicRoot*2,.9,'sine',.005);
  }

  /* 不存档：进度、分数、轮回都只活在这一次打开里，关掉页面就从头开始 */

  /* ---------- 尺寸 ---------- */
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const m=Math.min(W,H);
    cx=W/2; cy=Math.max(H*.30,Math.min(H*.35,250));
    /* 物件比以前大一点，主题才看得清 */
    coreR=Math.max(32,m*.095);
    pinLen=m*.170;                 /* 环拉长一点，同样多根星链也不至于挤死 */
    ballR=Math.max(7,m*.019);
    orbitR=coreR+pinLen;
    launchY=H-Math.max(100,H*.14);
    buildAmbient();
  }
  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',()=>setTimeout(resize,120));

  function buildAmbient(){
    stars=[]; amb=[];
    for(let i=0;i<46;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:rnd(.4,1.5),p:Math.random()*TAU,s:rnd(.3,.9)});
    for(let i=0;i<22;i++) amb.push({x:Math.random()*W,y:Math.random()*H,r:rnd(1.6,4.4),
      v:rnd(6,22),p:Math.random()*TAU,a:rnd(.15,.5)});
  }

  /* =========================================================
     中心物件：每个主题画自己的东西
     ========================================================= */
  function withCore(fn){
    const s=1+corePulse*.045;
    ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s); fn(coreR,theme); ctx.restore();
  }
  function disc(r,fill){ ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fillStyle=fill; ctx.fill(); }

  function drawPlanet(R,th){
    ctx.save();
    ctx.shadowColor='rgba(130,160,255,.8)'; ctx.shadowBlur=26;
    const g=ctx.createRadialGradient(-R*.38,-R*.42,R*.08,0,0,R);
    g.addColorStop(0,'#a8bcff'); g.addColorStop(.45,'#4a58c8'); g.addColorStop(1,'#1c2258');
    disc(R,g);
    ctx.restore();
    ctx.save(); ctx.rotate(-.42); ctx.scale(1,.28);
    ctx.strokeStyle='rgba(190,210,255,.55)'; ctx.lineWidth=R*.09;
    ctx.beginPath(); ctx.arc(0,0,R*1.42,0,TAU); ctx.stroke();
    ctx.restore();
    ctx.strokeStyle='rgba(190,210,255,.6)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.stroke();
  }

  function drawCake(R,th){
    /* 俯视的圆蛋糕：奶油环 → 果酱面 → 一圈草莓 → 中间一颗樱桃 */
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=18; ctx.shadowOffsetY=6;
    disc(R,'#f6e2c4');
    ctx.restore();
    /* 侧面一点厚度 */
    ctx.fillStyle='#e8c9a2';
    ctx.beginPath(); ctx.arc(0,R*.1,R*.99,0,Math.PI); ctx.fill();
    /* 奶油环 */
    ctx.strokeStyle='#fffaf2'; ctx.lineWidth=R*.16;
    ctx.beginPath(); ctx.arc(0,0,R*.86,0,TAU); ctx.stroke();
    /* 果酱面 */
    const jam=ctx.createRadialGradient(-R*.2,-R*.25,R*.08,0,0,R*.74);
    jam.addColorStop(0,'#ffd0dd'); jam.addColorStop(1,'#e86a90');
    disc(R*.74,jam);
    /* 切块线 */
    ctx.strokeStyle='rgba(180,70,100,.28)'; ctx.lineWidth=1.4;
    for(let i=0;i<6;i++){
      const a=i/6*TAU+.3;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*R*.72,Math.sin(a)*R*.72); ctx.stroke();
    }
    /* 一圈草莓 */
    for(let i=0;i<8;i++){
      const a=i/8*TAU-.4, x=Math.cos(a)*R*.6, y=Math.sin(a)*R*.6;
      ctx.fillStyle='#e8455f';
      ctx.beginPath(); ctx.ellipse(x,y,R*.09,R*.075,a,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.arc(x-R*.02,y-R*.02,R*.02,0,TAU); ctx.fill();
      ctx.fillStyle='#5f9c5a';
      ctx.beginPath(); ctx.ellipse(x,y-R*.09,R*.05,R*.025,a,0,TAU); ctx.fill();
    }
    /* 中间樱桃 + 蜡烛 */
    ctx.fillStyle='#c9314d';
    ctx.beginPath(); ctx.arc(0,0,R*.12,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(-R*.03,-R*.03,R*.035,0,TAU); ctx.fill();
    ctx.fillStyle='#fff6e0'; ctx.fillRect(-R*.018,-R*.36,R*.036,R*.2);
    ctx.fillStyle='#ffd166';
    ctx.beginPath(); ctx.ellipse(0,-R*.4,R*.035,R*.055,0,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,220,140,.35)';
    ctx.beginPath(); ctx.arc(0,-R*.4,R*.14,0,TAU); ctx.fill();
  }

  function drawHoop(R,th){
    /* 绣绷：木圈 + 绷紧的布 + 几针绣 */
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=18;
    disc(R*.94,'#f6ecd8');
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,R*.94,0,TAU); ctx.clip();
    /* 布纹 */
    ctx.strokeStyle='rgba(180,160,130,.28)'; ctx.lineWidth=1;
    for(let i=-R;i<R;i+=7){
      ctx.beginPath(); ctx.moveTo(i,-R); ctx.lineTo(i,R); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-R,i); ctx.lineTo(R,i); ctx.stroke();
    }
    /* 绣一朵小花 + 一条枝 */
    ctx.strokeStyle='#5f9c74'; ctx.lineWidth=R*.055; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-R*.4,R*.3); ctx.quadraticCurveTo(0,-R*.1,R*.4,-R*.32); ctx.stroke();
    const petals=['#ff8fb0','#ffd27a','#a8d8ff','#c9a4ff'];
    for(let i=0;i<4;i++){
      const px=-R*.34+i*R*.24, py=R*.24-i*R*.2;
      ctx.fillStyle=petals[i];
      for(let k=0;k<5;k++){
        const a=k/5*TAU;
        ctx.beginPath(); ctx.arc(px+Math.cos(a)*R*.07,py+Math.sin(a)*R*.07,R*.05,0,TAU); ctx.fill();
      }
      ctx.fillStyle='#fff3c8';
      ctx.beginPath(); ctx.arc(px,py,R*.03,0,TAU); ctx.fill();
    }
    ctx.restore();
    /* 木圈 */
    ctx.strokeStyle='#b98a5a'; ctx.lineWidth=R*.13;
    ctx.beginPath(); ctx.arc(0,0,R*.94,0,TAU); ctx.stroke();
    ctx.strokeStyle='rgba(255,225,190,.65)'; ctx.lineWidth=R*.035;
    ctx.beginPath(); ctx.arc(0,0,R*.99,0,TAU); ctx.stroke();
    /* 绷扣 */
    ctx.fillStyle='#8a6440';
    ctx.beginPath(); ctx.roundRect(R*.72,-R*.16,R*.24,R*.32,4); ctx.fill();
    /* 搭在边上的银针与线 */
    ctx.strokeStyle='#dfe6f2'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-R*.86,-R*.5); ctx.lineTo(-R*.5,-R*.86); ctx.stroke();
    ctx.strokeStyle='rgba(255,143,176,.85)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(-R*.5,-R*.86);
    ctx.quadraticCurveTo(R*.1,-R*1.05,R*.35,-R*.6); ctx.stroke();
  }

  function drawPlayer(R,th){
    /* 唱盘 */
    ctx.fillStyle='rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(0,R*.5,R*1.1,R*.28,0,0,TAU); ctx.fill();
    ctx.fillStyle='#2a2440';
    ctx.beginPath(); ctx.roundRect(-R*1.1,-R*.95,R*2.2,R*1.55,10); ctx.fill();
    ctx.fillStyle='#221c34';
    ctx.beginPath(); ctx.roundRect(-R*1.02,-R*.88,R*2.04,R*1.4,8); ctx.fill();
    /* 唱片 */
    ctx.save(); ctx.shadowColor='rgba(255,210,122,.35)'; ctx.shadowBlur=18;
    disc(R*.82,'#12101a'); ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1;
    for(let i=1;i<=4;i++){ ctx.beginPath(); ctx.arc(0,0,R*.82*i/5,0,TAU); ctx.stroke(); }
    ctx.save(); ctx.rotate(T*.9);
    ctx.fillStyle='#ffd27a'; ctx.beginPath(); ctx.arc(0,0,R*.28,0,TAU); ctx.fill();
    ctx.fillStyle='#3a2a12'; ctx.beginPath(); ctx.arc(0,0,R*.045,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(120,90,30,.5)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(-R*.22,0); ctx.lineTo(R*.2,0); ctx.stroke();
    ctx.restore();
    /* 唱臂 */
    ctx.strokeStyle='#cfd6e8'; ctx.lineWidth=R*.075; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(R*.92,-R*.62); ctx.lineTo(R*.34,-R*.2); ctx.stroke();
    ctx.fillStyle='#8e94ac'; ctx.beginPath(); ctx.arc(R*.92,-R*.62,R*.11,0,TAU); ctx.fill();
    /* 喇叭孔 */
    ctx.fillStyle='rgba(255,210,122,.5)';
    for(let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(-R*.78+i*R*.1,R*.42,R*.035,0,TAU); ctx.fill(); }
  }

  function drawPlant(R,th){
    /* 俯视的圆花盆：陶盆外圈 → 泥土 → 一圈叶 → 几朵花 */
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=16; ctx.shadowOffsetY=5;
    disc(R,'#b86744');
    ctx.restore();
    ctx.strokeStyle='#d2855c'; ctx.lineWidth=R*.1;
    ctx.beginPath(); ctx.arc(0,0,R*.94,0,TAU); ctx.stroke();
    const soil=ctx.createRadialGradient(0,0,R*.1,0,0,R*.84);
    soil.addColorStop(0,'#6b4a30'); soil.addColorStop(1,'#4a3221');
    disc(R*.84,soil);
    /* 叶片从中心朝外铺开 */
    for(let i=0;i<9;i++){
      const a=i/9*TAU+.2, len=R*(.5+((i*7)%3)*.08);
      ctx.save(); ctx.rotate(a);
      ctx.fillStyle=i%2?'#6fb95f':'#4f8f4a';
      ctx.beginPath(); ctx.ellipse(len*.6,0,len*.42,R*.12,0,0,TAU); ctx.fill();
      ctx.restore();
    }
    /* 花 */
    const fl=['#ff9db8','#ffd97a','#c7a4ff'];
    for(let i=0;i<3;i++){
      const a=i/3*TAU+.9, x=Math.cos(a)*R*.42, y=Math.sin(a)*R*.42;
      for(let k=0;k<5;k++){
        const ka=k/5*TAU;
        ctx.fillStyle=fl[i];
        ctx.beginPath(); ctx.arc(x+Math.cos(ka)*R*.1,y+Math.sin(ka)*R*.1,R*.085,0,TAU); ctx.fill();
      }
      ctx.fillStyle='#fff6c8';
      ctx.beginPath(); ctx.arc(x,y,R*.05,0,TAU); ctx.fill();
    }
    /* 盆沿高光 */
    ctx.strokeStyle='rgba(255,210,180,.5)'; ctx.lineWidth=R*.03;
    ctx.beginPath(); ctx.arc(0,0,R*.99,Math.PI*1.1,Math.PI*1.5); ctx.stroke();
  }

  function drawCastle(R,th){
    /* 俯视的圆沙堡：外圈城齿 → 环形城墙 → 内院 → 中心塔 → 旗 */
    ctx.fillStyle='rgba(180,235,255,.20)';
    ctx.beginPath(); ctx.arc(0,0,R*1.02,0,TAU); ctx.fill();
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=16; ctx.shadowOffsetY=5;
    disc(R*.96,'#e8cf9a');
    ctx.restore();
    /* 城齿：沿外圈一圈小方块 */
    for(let i=0;i<16;i++){
      const a=i/16*TAU;
      ctx.save(); ctx.translate(Math.cos(a)*R*.92,Math.sin(a)*R*.92); ctx.rotate(a);
      ctx.fillStyle=i%2?'#f2dcaa':'#ddc089';
      ctx.fillRect(-R*.09,-R*.07,R*.18,R*.14);
      ctx.restore();
    }
    /* 内院 */
    disc(R*.7,'#d9b87e');
    ctx.strokeStyle='rgba(150,115,60,.5)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,R*.7,0,TAU); ctx.stroke();
    /* 中心塔 */
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=10;
    disc(R*.34,'#f0d8a4');
    ctx.restore();
    ctx.fillStyle='#c9a86a';
    ctx.beginPath(); ctx.arc(0,0,R*.24,0,TAU); ctx.fill();
    ctx.fillStyle='#8a6a3f';
    ctx.beginPath();
    ctx.moveTo(-R*.08,R*.02); ctx.lineTo(-R*.08,R*.16);
    ctx.quadraticCurveTo(0,R*.26,R*.08,R*.16); ctx.lineTo(R*.08,R*.02);
    ctx.closePath(); ctx.fill();
    /* 旗 */
    ctx.strokeStyle='#b98a5a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,-R*.2); ctx.lineTo(0,-R*.62); ctx.stroke();
    ctx.fillStyle='#ff8fb0';
    ctx.beginPath();
    ctx.moveTo(0,-R*.62); ctx.lineTo(R*.22,-R*.54); ctx.lineTo(0,-R*.46);
    ctx.closePath(); ctx.fill();
    /* 四个角塔 */
    for(let i=0;i<4;i++){
      const a=i/4*TAU+Math.PI/4;
      disc(R*.1,'#f2dcaa');
      ctx.save(); ctx.translate(Math.cos(a)*R*.6,Math.sin(a)*R*.6);
      ctx.fillStyle='#f2dcaa';
      ctx.beginPath(); ctx.arc(0,0,R*.12,0,TAU); ctx.fill();
      ctx.fillStyle='#c9a86a';
      ctx.beginPath(); ctx.arc(0,0,R*.07,0,TAU); ctx.fill();
      ctx.restore();
    }
    /* 浪花 */
    ctx.strokeStyle='rgba(200,240,255,.8)'; ctx.lineWidth=2.2; ctx.lineCap='round';
    for(let i=0;i<3;i++){
      const rr=R*1.04+Math.sin(T*1.6+i)*3+i*4;
      ctx.beginPath(); ctx.arc(0,0,rr,Math.PI*.15+i,Math.PI*.85+i); ctx.stroke();
    }
  }

  function drawYarn(R,th){
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(0,R*.62,R*.9,R*.18,0,0,TAU); ctx.fill();
    ctx.save(); ctx.rotate(-.15);
    const g=ctx.createRadialGradient(-R*.25,-R*.3,R*.1,0,0,R*.86);
    g.addColorStop(0,'#ffc2d4'); g.addColorStop(.6,'#ff8fb0'); g.addColorStop(1,'#c25578');
    disc(R*.86,g);
    /* 缠绕的线 */
    ctx.strokeStyle='rgba(255,226,238,.55)'; ctx.lineWidth=R*.04; ctx.lineCap='round';
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.ellipse(R*.05,R*.02,R*.78,R*.3,0.5+i*.55,0,TAU);
      ctx.stroke();
    }
    ctx.strokeStyle='rgba(200,80,120,.5)'; ctx.lineWidth=1.2;
    for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.ellipse(0,0,R*.7,R*.34,-.5+i*.7,0,TAU); ctx.stroke();
    }
    ctx.restore();
    /* 拖出来的一股线 */
    ctx.strokeStyle='#ff9db8'; ctx.lineWidth=R*.05; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(R*.8,R*.2);
    ctx.bezierCurveTo(R*1.25,R*.5,R*.6,R*.95,R*1.05,R*.9);
    ctx.stroke();
  }

  function drawLantern(R,th){
    const glow=ctx.createRadialGradient(0,0,R*.2,0,0,R*1.9);
    glow.addColorStop(0,'rgba(255,170,90,.35)');
    glow.addColorStop(1,'rgba(255,170,90,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,R*1.9,0,TAU); ctx.fill();
    /* 灯身 */
    const g=ctx.createRadialGradient(-R*.2,-R*.25,R*.1,0,0,R*.95);
    g.addColorStop(0,'#ffd9a0'); g.addColorStop(.55,'#f07a3c'); g.addColorStop(1,'#a83a26');
    ctx.beginPath(); ctx.ellipse(0,0,R*.86,R*.95,0,0,TAU); ctx.fillStyle=g; ctx.fill();
    /* 竖骨 */
    ctx.strokeStyle='rgba(120,40,20,.35)'; ctx.lineWidth=1.4;
    for(let i=1;i<5;i++){
      const k=i/5;
      ctx.beginPath(); ctx.ellipse(0,0,R*.86*k,R*.95,0,0,TAU); ctx.stroke();
    }
    ctx.strokeStyle='rgba(120,40,20,.3)';
    for(let i=0;i<4;i++){
      const y=-R*.7+i*R*.46;
      ctx.beginPath(); ctx.ellipse(0,y,Math.sqrt(Math.max(0,1-Math.pow(y/(R*.95),2)))*R*.86,R*.04,0,0,TAU); ctx.stroke();
    }
    /* 上下盖 */
    ctx.fillStyle='#c9a24a';
    ctx.beginPath(); ctx.roundRect(-R*.3,-R*1.06,R*.6,R*.16,4); ctx.fill();
    ctx.beginPath(); ctx.roundRect(-R*.3,R*.9,R*.6,R*.16,4); ctx.fill();
    /* 穗子 */
    ctx.strokeStyle='#e0b45c'; ctx.lineWidth=2;
    for(let i=-1;i<=1;i++){
      ctx.beginPath(); ctx.moveTo(i*R*.07,R*1.06); ctx.lineTo(i*R*.09,R*1.32); ctx.stroke();
    }
  }

  function drawSnow(R,th){
    const g=ctx.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R);
    g.addColorStop(0,'rgba(220,245,255,.95)'); g.addColorStop(.6,'rgba(140,200,235,.75)'); g.addColorStop(1,'rgba(60,110,150,.85)');
    disc(R*.95,g);
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R*.95,0,TAU); ctx.clip();
    /* 里面小树与雪 */
    ctx.fillStyle='#2f6b5a';
    for(let i=0;i<3;i++){
      const w=R*(.5-i*.11), y=R*.28-i*R*.24;
      ctx.beginPath(); ctx.moveTo(0,y-R*.3); ctx.lineTo(w/2,y); ctx.lineTo(-w/2,y); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<14;i++){
      const a=i*2.1, rr=R*(.2+ (i%4)*.16);
      ctx.beginPath(); ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,R*.026,0,TAU); ctx.fill();
    }
    ctx.restore();
    /* 高光与底座 */
    ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=R*.05; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,0,R*.82,Math.PI*1.15,Math.PI*1.45); ctx.stroke();
    ctx.fillStyle='#4a6076';
    ctx.beginPath(); ctx.roundRect(-R*.36,R*.88,R*.72,R*.18,4); ctx.fill();
  }

  /* =========================================================
     新增九主题：外轮廓一律是正圆，靠盘面上的纹样认出是谁
     ========================================================= */
  function ringLine(R,r,color,w){
    ctx.strokeStyle=color; ctx.lineWidth=w;
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.stroke();
  }

  function drawRadar(R){
    /* 全息雷达：扫描扇 + 网格 + 光点 */
    const g=ctx.createRadialGradient(0,0,R*.1,0,0,R);
    g.addColorStop(0,'#0d3b46'); g.addColorStop(.68,'#082630'); g.addColorStop(1,'#04151c');
    disc(R,g);
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.clip();
    ctx.strokeStyle='rgba(90,240,220,.22)'; ctx.lineWidth=1;
    for(let i=1;i<=4;i++){ ctx.beginPath(); ctx.arc(0,0,R*i/5,0,TAU); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-R,0); ctx.lineTo(R,0); ctx.moveTo(0,-R); ctx.lineTo(0,R); ctx.stroke();
    const a=T*.9;
    const sweep=ctx.createLinearGradient(0,0,Math.cos(a)*R,Math.sin(a)*R);
    sweep.addColorStop(0,'rgba(80,255,220,.02)'); sweep.addColorStop(1,'rgba(80,255,220,.34)');
    ctx.fillStyle=sweep;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,a-.66,a); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(140,255,235,.85)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R); ctx.stroke();
    ctx.fillStyle='#a8ffe8';
    for(let i=0;i<4;i++){
      const ang=i*1.9+.4, rr=R*(.3+(i%3)*.2);
      ctx.beginPath(); ctx.arc(Math.cos(ang)*rr,Math.sin(ang)*rr,R*.035,0,TAU); ctx.fill();
    }
    ctx.restore();
    ringLine(R,R*.98,'rgba(110,255,225,.55)',2);
    ringLine(R,R*.92,'rgba(110,255,225,.14)',1);
  }

  function drawWatch(R){
    /* 怀表：黄铜壳 + 珐琅盘 + 60 刻度 + 走动的指针 */
    disc(R,'#c8a355');
    ringLine(R,R*.96,'rgba(255,235,180,.72)',R*.035);
    disc(R*.87,'#f3ead2');
    disc(R*.84,'#fbf5e6');
    for(let i=0;i<60;i++){
      const a=i/60*TAU-Math.PI/2, big=i%5===0;
      ctx.strokeStyle=big?'#5a4426':'rgba(90,68,38,.4)'; ctx.lineWidth=big?2:1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*R*(big?.7:.76),Math.sin(a)*R*(big?.7:.76));

  function drawAmber(R){

    for(let k=0;k<5;k++){
      ctx.beginPath();
      for(let i=0;i<=36;i++){
        const t=i/36, x=-R+R*2*t, y=-R*.6+k*R*.3+Math.sin(t*7+k*1.3)*R*.1;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);

    for(let i=0;i<14;i++){

  function drawPorcelain(R){
    /* 青花瓷盘：缠枝纹 */
    disc(R,'#eef3f4');
    ringLine(R,R*.97,'#4a7fae',R*.045);
    disc(R*.88,'#f7fbfc');
    const BLUE='#3d6fa8';
    ctx.strokeStyle=BLUE; ctx.lineWidth=1.6;
    for(let i=0;i<24;i++){
      const a=i/24*TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*R*.78,Math.sin(a)*R*.78);
      ctx.lineTo(Math.cos(a+.06)*R*.86,Math.sin(a+.06)*R*.86); ctx.stroke();
    }
    ringLine(R,R*.72,BLUE,1.6);
    for(let k=0;k<5;k++){
      ctx.save(); ctx.rotate(k/5*TAU+T*.08);
      ctx.strokeStyle=BLUE; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,-R*.18);
      ctx.bezierCurveTo(R*.2,-R*.32,R*.34,-R*.1,R*.16,-R*.02); ctx.stroke();
      ctx.beginPath(); ctx.arc(R*.16,-R*.02,R*.09,0,TAU*.8); ctx.stroke();
      ctx.fillStyle=BLUE;
      for(let j=0;j<3;j++){
        ctx.save(); ctx.translate(R*(.1+j*.09),-R*(.24-j*.06)); ctx.rotate(-.6+j*.5);

      }
      ctx.restore();
    }
    disc(R*.2,'#e3eef7');
    ringLine(R,R*.2,BLUE,2);
    ctx.fillStyle=BLUE;

      const a=i/6*TAU;
      ctx.beginPath(); ctx.ellipse(Math.cos(a)*R*.1,Math.sin(a)*R*.1,R*.055,R*.025,a,0,TAU); ctx.fill();

    for(let i=1;i<=5;i++){
      ctx.beginPath();

  function drawIncense(R){
    /* 圆形铜香炉：俯视，铺着灰白香灰，三足只露出一点边 */

    disc(R*.8,g);
    /* 香灰上的耙纹 */
    ctx.strokeStyle='rgba(120,110,95,.35)'; ctx.lineWidth=1.2;
    for(let i=1;i<=4;i++){ ctx.beginPath(); ctx.arc(0,0,R*.8*i/5,0,TAU); ctx.stroke(); }
    /* 三支已插的线香 + 红点 */
    for(let i=0;i<3;i++){
      const a=i/3*TAU-.5, x=Math.cos(a)*R*.38, y=Math.sin(a)*R*.38;
      ctx.strokeStyle='#7a3b2c'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+R*.06,y-R*.2); ctx.stroke();
      ctx.fillStyle='#e2503c'; ctx.beginPath(); ctx.arc(x+R*.06,y-R*.2,2,0,TAU); ctx.fill();
    }

    ctx.fillStyle='#c9a35e';

  function drawHotpot(R){
    /* 俯视鸳鸯锅：红汤清汤各一半，中间一道 S 形隔板 */
    disc(R,'#b9bcc4');
    ringLine(R,R*.96,'#e8eaee',R*.05);
    disc(R*.86,'#4a3020');
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R*.84,0,TAU); ctx.clip();
    /* 清汤（上半）红汤（下半） */
    ctx.fillStyle='#d8c48c'; ctx.fillRect(-R,-R,R*2,R);
    ctx.fillStyle='#a8281c'; ctx.fillRect(-R,0,R*2,R);
    /* S 形隔板 */
    ctx.strokeStyle='#dfe2e8'; ctx.lineWidth=R*.045;
    ctx.beginPath();
    ctx.moveTo(-R,-R*.02); ctx.bezierCurveTo(-R*.3,-R*.42,R*.3,R*.42,R,-R*.02); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(-R,-R*.02); ctx.bezierCurveTo(-R*.3,-R*.42,R*.3,R*.42,R,-R*.02); ctx.stroke();
    /* 红汤里的辣椒花椒、清汤里的枸杞 */
    for(let i=0;i<14;i++){
      const a=i*2.399, rr=R*(.2+(i%5)*.14), x=Math.cos(a)*rr, y=Math.sin(a)*rr;
      ctx.fillStyle=y>0?(i%2?'#e8502e':'#6b2a12'):(i%2?'#c4533a':'#7a8a48');
      ctx.beginPath(); ctx.ellipse(x,y,R*.045,R*.022,a,0,TAU); ctx.fill();
    }

    ctx.strokeStyle='rgba(255,240,200,.28)'; ctx.lineWidth=1.4;
    for(let i=0;i<4;i++){
      ctx.beginPath(); ctx.arc(0,R*.1,R*(.2+i*.16),.2+i*.3,1.4+i*.3); ctx.stroke();
    }

    ringLine(R,R*.84,'rgba(255,255,255,.5)',1.6);

  function drawCactus(R){
    /* 俯视圆仙人球，一圈棱 */
    disc(R,'#2f6b42');
    const g=ctx.createRadialGradient(-R*.2,-R*.25,R*.05,0,0,R);
    g.addColorStop(0,'#6fbf78'); g.addColorStop(.6,'#3f8a50'); g.addColorStop(1,'#205234');

    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R*.92,0,TAU); ctx.clip();

      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*R*.92,Math.sin(a)*R*.92); ctx.stroke();
    }
    ctx.restore();
    /* 每条棱上的刺座 */
    for(let i=0;i<12;i++){
      const a=i/12*TAU;
      for(let k=1;k<=3;k++){

        ctx.fillStyle='rgba(240,250,220,.8)';
        ctx.beginPath(); ctx.arc(x,y,1.5,0,TAU); ctx.fill();

    }
    ringLine(R,R*.97,'rgba(150,220,150,.4)',2);
  }

  function drawPeacock(R){
    /* 孔雀开屏：尾羽铺成大正圆，眼纹疏疏落落几只，不堆成密孔 */
    disc(R,'#0d4a48');
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.clip();
    const cols=['#10665e','#15776a','#0d5a55','#18887a'];
    for(let i=0;i<12;i++){
      ctx.fillStyle=cols[i%4];
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,i/12*TAU,(i+1)/12*TAU); ctx.closePath(); ctx.fill();
    }
    /* 细羽丝：每片尾羽一根，留出呼吸感 */
    ctx.strokeStyle='rgba(160,235,205,.28)'; ctx.lineWidth=1;
    for(let i=0;i<24;i++){
      const a=i/24*TAU;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*R*.22,Math.sin(a)*R*.22);
      ctx.lineTo(Math.cos(a)*R*.95,Math.sin(a)*R*.95); ctx.stroke();
    }
    /* 只有 6 只眼纹，画大画清楚 */
    for(let i=0;i<6;i++){
      const a=i/6*TAU-.22, x=Math.cos(a)*R*.62, y=Math.sin(a)*R*.62, s=R*.2;
      ctx.fillStyle='#2aa58a'; ctx.beginPath(); ctx.arc(x,y,s,0,TAU); ctx.fill();
      ctx.fillStyle='#0d3a52'; ctx.beginPath(); ctx.arc(x,y,s*.68,0,TAU); ctx.fill();
      ctx.fillStyle='#e8c34a'; ctx.beginPath(); ctx.arc(x,y,s*.42,0,TAU); ctx.fill();
      ctx.fillStyle='#2b2a6e'; ctx.beginPath(); ctx.arc(x,y,s*.22,0,TAU); ctx.fill();
    }
    ctx.restore();
    ringLine(R,R*.98,'rgba(120,220,190,.55)',2);
    /* 中心的孔雀身 */
    disc(R*.15,'#1b4a8a');
    disc(R*.075,'#3f7cc4');
  }

  function drawHoneycomb(R){
    /* 金黄六边形格子铺成的圆盘 */
    disc(R,'#8a5c14');
    const g=ctx.createRadialGradient(-R*.2,-R*.25,R*.05,0,0,R);
    g.addColorStop(0,'#ffd76a'); g.addColorStop(.6,'#e0a52e'); g.addColorStop(1,'#a66f14');
    disc(R*.9,g);
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R*.9,0,TAU); ctx.clip();
    const hr=R*.19;
    for(let row=-4;row<=4;row++){
      for(let col=-4;col<=4;col++){
        const x=col*hr*1.74+(row%2?hr*.87:0), y=row*hr*1.5;
        ctx.beginPath();
        for(let k=0;k<6;k++){
          const a=k/6*TAU+Math.PI/6;
          const px=x+Math.cos(a)*hr*.92, py=y+Math.sin(a)*hr*.92;
          k?ctx.lineTo(px,py):ctx.moveTo(px,py);
        }
        ctx.closePath();
        ctx.fillStyle=((row+col)%3===0)?'rgba(255,240,170,.28)':'rgba(120,70,10,.12)';
        ctx.fill();
        ctx.strokeStyle='rgba(120,75,12,.65)'; ctx.lineWidth=1.6; ctx.stroke();
      }
    }
    ctx.restore();
    ringLine(R,R*.96,'rgba(255,230,150,.7)',2.4);
  }

  function drawFishtank(R){
    /* 俯视圆玻璃鱼缸，底下铺砂石 */
    disc(R,'#7fc8d0');
    const g=ctx.createRadialGradient(-R*.2,-R*.3,R*.05,0,0,R);
    g.addColorStop(0,'#5fb8c8'); g.addColorStop(.6,'#2b7f96'); g.addColorStop(1,'#134858');
    disc(R*.9,g);
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R*.9,0,TAU); ctx.clip();
    /* 砂石：用索引算固定坐标，不能每帧随机，不然整个缸会闪 */
    for(let i=0;i<46;i++){
      const u=(Math.sin(i*127.1+1.7)*43758.5453)%1;
      const v=(Math.sin(i*311.7+4.2)*22578.1459)%1;
      const sx=(Math.abs(u)*2-1)*R, sy=(Math.abs(v)*2-1)*R;
      if(sx*sx+sy*sy>R*R*.92) continue;
      ctx.fillStyle=i%3?'rgba(230,220,180,.65)':'rgba(180,170,140,.55)';
      ctx.beginPath(); ctx.arc(sx,sy,1.6+Math.abs(u)*2,0,TAU); ctx.fill();
    }
    /* 水波：静态同心细纹，不随时间抖动，缸面才是静的 */
    ctx.strokeStyle='rgba(220,250,255,.2)'; ctx.lineWidth=1.2;
    for(let i=1;i<=4;i++){
      ctx.beginPath();
      for(let k=0;k<=40;k++){
        const a=k/40*TAU, rr=R*.22*i+Math.sin(a*4+i)*1.6;
        const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
        k?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
    }
    /* 一条小鱼：慢慢游，不抢眼 */
    ctx.save(); ctx.translate(R*.18,-R*.14); ctx.rotate(T*.18);
    ctx.fillStyle='#ff9a5c';
    ctx.beginPath(); ctx.ellipse(0,0,R*.13,R*.07,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-R*.12,0); ctx.lineTo(-R*.22,-R*.07); ctx.lineTo(-R*.22,R*.07); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#2b2a3a'; ctx.beginPath(); ctx.arc(R*.07,-R*.02,1.6,0,TAU); ctx.fill();
    ctx.restore();
    ctx.restore();
    /* 玻璃唇边 + 高光 */
    ringLine(R,R*.96,'rgba(220,250,255,.8)',R*.045);
    ctx.fillStyle='rgba(255,255,255,.28)';
    ctx.beginPath(); ctx.ellipse(-R*.32,-R*.42,R*.22,R*.09,-.6,0,TAU); ctx.fill();
  }

  function drawCampfire(R){
    /* 石头围出的圆圈，中间烧着火 */
    disc(R,'#2a1c14');
    disc(R*.9,'#3a2418');
    /* 石圈 */
    for(let i=0;i<11;i++){
      const a=i/11*TAU, rr=R*.8;
      ctx.save(); ctx.translate(Math.cos(a)*rr,Math.sin(a)*rr); ctx.rotate(a);
      ctx.fillStyle=i%2?'#8f8578':'#6e675d';
      ctx.beginPath(); ctx.ellipse(0,0,R*.14,R*.1,0,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.18)';
      ctx.beginPath(); ctx.ellipse(-R*.03,-R*.03,R*.06,R*.03,0,0,TAU); ctx.fill();
      ctx.restore();
    }
    /* 炭与火 */
    disc(R*.58,'#4a2410');
    const fg=ctx.createRadialGradient(0,R*.1,0,0,0,R*.5);
    fg.addColorStop(0,'#ffe27a'); fg.addColorStop(.35,'#ff9a3c'); fg.addColorStop(.7,'#d9451e'); fg.addColorStop(1,'rgba(120,30,10,0)');
    ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(0,0,R*.5,0,TAU); ctx.fill();
    /* 火舌 */
    ctx.save(); ctx.rotate(Math.sin(T*1.4)*.08);
    for(let i=0;i<5;i++){
      const x=(i-2)*R*.13;
      ctx.fillStyle=i%2?'#ffcb4a':'#ff7a2e';
      ctx.beginPath();
      ctx.moveTo(x-R*.07,R*.2);
      ctx.quadraticCurveTo(x-R*.02,-R*.1+Math.sin(T*3+i)*R*.06,x,-R*.36);
      ctx.quadraticCurveTo(x+R*.06,-R*.08,x+R*.07,R*.2);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ringLine(R,R*.98,'rgba(190,170,140,.35)',1.6);
  }

  function drawDreamcatcher(R){
    /* 藤条圆环，中间编着网，挂一颗珠子 */
    disc(R,'rgba(180,150,200,.10)');
    ringLine(R,R*.94,'#a97c48',R*.075);
    ringLine(R,R*.88,'rgba(230,200,150,.55)',1.4);
    /* 网：同心多边形 + 放射 */
    ctx.strokeStyle='rgba(230,220,240,.62)'; ctx.lineWidth=1;
    for(let ring=1;ring<=4;ring++){
      const rr=R*.8*ring/4;
      ctx.beginPath();
      for(let k=0;k<=9;k++){
        const a=k/9*TAU+ring*.16, x=Math.cos(a)*rr, y=Math.sin(a)*rr;
        k?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
    }
    for(let i=0;i<9;i++){
      const a=i/9*TAU;
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*R*.8,Math.sin(a)*R*.8); ctx.stroke();
    }
    /* 结点小珠 */
    for(let i=0;i<9;i++){
      const a=i/9*TAU;
      ctx.fillStyle='#e8d8b0';
      ctx.beginPath(); ctx.arc(Math.cos(a)*R*.8,Math.sin(a)*R*.8,2,0,TAU); ctx.fill();
    }
    /* 中心珠 */
    const g=ctx.createRadialGradient(-R*.04,-R*.05,0,0,0,R*.14);
    g.addColorStop(0,'#f0e0ff'); g.addColorStop(1,'#9a72c8');
    disc(R*.14,g);
  }

  function drawPowder(R){
    /* 打开的散粉盒里，圆圆的粉扑 */
    disc(R,'#c9a0b8');
    ringLine(R,R*.96,'#ffe0ee',R*.05);
    disc(R*.86,'#3e2a36');
    /* 盒内粉面 */
    const g=ctx.createRadialGradient(-R*.2,-R*.25,R*.05,0,0,R);
    g.addColorStop(0,'#ffe6f0'); g.addColorStop(.6,'#f3c2d6'); g.addColorStop(1,'#d498b4');
    disc(R*.78,g);
    /* 散粉颗粒 */
    ctx.fillStyle='rgba(255,255,255,.65)';
    for(let i=0;i<30;i++){
      const a=i*2.399, rr=R*(.15+(i%7)*.1);
      ctx.beginPath(); ctx.arc(Math.cos(a)*rr,Math.sin(a)*rr,1.2,0,TAU); ctx.fill();
    }
    /* 粉扑：绒毛圆 */
    const pg=ctx.createRadialGradient(-R*.1,-R*.14,R*.02,0,0,R*.5);
    pg.addColorStop(0,'#fff6fa'); pg.addColorStop(1,'#e9c6d8');
    disc(R*.46,pg);
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R*.46,0,TAU); ctx.clip();
    ctx.strokeStyle='rgba(210,160,190,.5)'; ctx.lineWidth=.8;
    for(let i=0;i<70;i++){
      const a=i*2.39996, rr=R*.46*(i%10)/10;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
      ctx.lineTo(Math.cos(a)*R*.46,Math.sin(a)*R*.46); ctx.stroke();
    }
    ctx.restore();
    ringLine(R,R*.46,'rgba(255,255,255,.8)',1.6);
    /* 闪粉 */
    ctx.fillStyle='#fff';
    for(let i=0;i<6;i++){
      const a=i*1.9;
      drawStar(Math.cos(a)*R*.62,Math.sin(a)*R*.62,2.4,.9,'#fff6c8',5);
    }
  }

  function drawMirror(R){
    /* 圆形翻盖小化妆镜 */
    disc(R,'#d8a86a');
    ringLine(R,R*.96,'#ffe6ae',R*.055);
    disc(R*.86,'#b9833f');
    /* 镜面 */
    const g=ctx.createRadialGradient(-R*.2,-R*.3,R*.05,0,0,R);

    disc(R*.8,g);
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R*.8,0,TAU); ctx.clip();
    /* 斜向玻璃反光 */
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.beginPath();
    ctx.moveTo(-R*.8,-R*.25); ctx.lineTo(-R*.25,-R*.8); ctx.lineTo(R*.05,-R*.8); ctx.lineTo(-R*.8,R*.05);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.beginPath();
    ctx.moveTo(R*.1,-R*.8); ctx.lineTo(R*.35,-R*.8); ctx.lineTo(-R*.8,R*.35); ctx.lineTo(-R*.8,R*.1);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ringLine(R,R*.8,'rgba(255,240,210,.7)',1.6);
    /* 翻盖铰链 + 小扣 */
    ctx.fillStyle='#e8c07a';
    ctx.beginPath(); ctx.roundRect(-R*.12,R*.86,R*.24,R*.14,3); ctx.fill();
    ctx.fillStyle='#fff0c8';
    ctx.beginPath(); ctx.arc(0,-R*.9,2.6,0,TAU); ctx.fill();
  }

  /* 莲蓬：俯视的莲房，莲子一颗颗嵌在圆里 */
  function drawLotus(R){
    const g=ctx.createRadialGradient(-R*.2,-R*.25,R*.05,0,0,R);
    g.addColorStop(0,'#c8dca0'); g.addColorStop(.6,'#8fb464'); g.addColorStop(1,'#4f7a42');
    disc(R,g);
    ringLine(R,R*.97,'rgba(220,245,190,.6)',2.4);
    /* 外圈一层淡粉花瓣托着莲房 */
    for(let i=0;i<10;i++){
      const a=i/10*TAU;
      ctx.save(); ctx.rotate(a);
      ctx.fillStyle='rgba(248,190,212,.35)';
      ctx.beginPath(); ctx.ellipse(0,-R*.83,R*.16,R*.3,0,0,TAU); ctx.fill();
      ctx.restore();
    }
    /* 莲子：几圈同心排布的小凹孔 */
    for(let ring=0;ring<3;ring++){
      const n=ring===0?1:(ring===1?7:13), rr=R*(ring*.28);
      for(let i=0;i<n;i++){
        const a=i/n*TAU+ring*.4, x=Math.cos(a)*rr, y=Math.sin(a)*rr;
        ctx.fillStyle='#6b8f4e';
        ctx.beginPath(); ctx.arc(x,y,R*.088,0,TAU); ctx.fill();
        const sg=ctx.createRadialGradient(x-R*.02,y-R*.02,0,x,y,R*.075);
        sg.addColorStop(0,'#e9e6a8'); sg.addColorStop(1,'#9fb45c');
        ctx.fillStyle=sg;
        ctx.beginPath(); ctx.arc(x,y,R*.068,0,TAU); ctx.fill();
        ctx.fillStyle='rgba(80,110,50,.55)';
        ctx.beginPath(); ctx.arc(x,y,R*.018,0,TAU); ctx.fill();
      }
    }
    ringLine(R,R*.99,'rgba(240,255,210,.35)',1.4);
  }

  /* ---------- 再补八主题的正圆 ---------- */
  function drawDrum(R){
    /* 俯视鼓面：鼓皮 + 金属圈 + 螺钉 */

    ctx.restore();

    ctx.fillStyle='#c9d0d8';

  function drawMoonRabbit(R){
    /* 满月 + 月上玉兔的淡淡剪影 */
    const g=ctx.createRadialGradient(-R*.2,-R*.26,R*.05,0,0,R);
    g.addColorStop(0,'#ffffff'); g.addColorStop(.55,'#e8eeff'); g.addColorStop(1,'#b9c6e6');
    disc(R,g);
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.clip();
    ctx.fillStyle='rgba(150,165,200,.18)';
    const cr=[[-.32,-.2,.2],[.3,.18,.16],[.05,-.45,.1],[-.2,.42,.13]];
    for(const c of cr){ ctx.beginPath(); ctx.arc(c[0]*R,c[1]*R,c[2]*R,0,TAU); ctx.fill(); }
    /* 玉兔剪影：耳朵 + 身 + 胡萝卜 */
    ctx.fillStyle='rgba(120,135,180,.42)';
    ctx.beginPath(); ctx.ellipse(R*.06,R*.2,R*.2,R*.24,0,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-R*.02,-R*.1,R*.07,R*.2,-.18,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(R*.12,-R*.12,R*.06,R*.18,.2,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(220,140,90,.55)';
    ctx.beginPath(); ctx.moveTo(R*.16,R*.24); ctx.lineTo(R*.36,R*.16); ctx.lineTo(R*.2,R*.32); ctx.closePath(); ctx.fill();
    ctx.restore();
    ringLine(R,R*.98,'rgba(255,255,255,.85)',2);
  }
  function drawPiano(R){
    /* 七等分的白键圆盘 + 黑键 */
    disc(R,'#1a1c22');
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R*.95,0,TAU); ctx.clip();
    for(let i=0;i<7;i++){
      ctx.fillStyle=i%2?'#f2eee2':'#fffaf0';
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,R*.95,i/7*TAU,(i+1)/7*TAU); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle='rgba(60,60,70,.5)'; ctx.lineWidth=1.4;
    for(let i=0;i<7;i++){
      const a=i/7*TAU;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*R*.95,Math.sin(a)*R*.95); ctx.stroke();
    }
    /* 黑键落在分界上 */
    ctx.fillStyle='#22242c';
    for(let i=0;i<7;i++){
      if(i===2||i===6) continue;
      const a=(i+1)/7*TAU;
      ctx.save(); ctx.rotate(a);
      ctx.beginPath(); ctx.roundRect(R*.42,-R*.075,R*.42,R*.15,2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    ringLine(R,R*.97,'#d8d2c2',2.4);
    disc(R*.14,'#2a2c34');
    ringLine(R,R*.14,'rgba(255,255,255,.3)',1.4);
  }
  function drawBurger(R){
    /* 俯视汉堡：最上面是撒芝麻的面包 */
    const g=ctx.createRadialGradient(-R*.2,-R*.3,R*.05,0,0,R);
    g.addColorStop(0,'#f6c469'); g.addColorStop(.6,'#dd9840'); g.addColorStop(1,'#a8621f');
    disc(R,g);
    ringLine(R,R*.97,'#8a4a18',R*.045);
    /* 露出的生菜、番茄、肉饼一圈 */
    ringLine(R,R*.82,'rgba(110,160,60,.85)',R*.07);
    ringLine(R,R*.74,'rgba(200,60,40,.8)',R*.045);
    ringLine(R,R*.67,'rgba(110,62,34,.8)',R*.055);
    /* 芝麻 */
    ctx.fillStyle='rgba(255,246,214,.9)';
    for(let i=0;i<18;i++){
      const a=i*2.399, rr=R*(.16+(i%5)*.13);
      ctx.save(); ctx.translate(Math.cos(a)*rr,Math.sin(a)*rr); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0,0,R*.035,R*.016,0,0,TAU); ctx.fill();
      ctx.restore();
    }
    ringLine(R,R*.97,'rgba(255,220,150,.6)',1.4);
  }
  function drawFirefly(R){
    /* 透明玻璃罐俯视：罐口 + 里面浮动的萤火 */
    disc(R,'rgba(200,235,220,.14)');
    ringLine(R,R*.96,'rgba(220,250,235,.7)',R*.05);
    const g=ctx.createRadialGradient(-R*.2,-R*.3,R*.05,0,0,R);
    g.addColorStop(0,'rgba(90,140,110,.5)'); g.addColorStop(1,'rgba(30,60,50,.65)');
    disc(R*.84,g);
    /* 罐底草叶 */
    ctx.fillStyle='rgba(110,160,100,.45)';
    for(let i=0;i<7;i++){
      const a=i/7*TAU;
      ctx.save(); ctx.translate(Math.cos(a)*R*.62,Math.sin(a)*R*.62); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0,0,R*.14,R*.05,0,0,TAU); ctx.fill();
      ctx.restore();
    }
    /* 萤火 */
    for(let i=0;i<9;i++){
      const a=i*2.399+T*.15, rr=R*(.14+(i%4)*.18);
      const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
      const fg=ctx.createRadialGradient(x,y,0,x,y,R*.1);
      fg.addColorStop(0,'rgba(240,255,160,.95)'); fg.addColorStop(1,'rgba(220,255,140,0)');
      ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(x,y,R*.1,0,TAU); ctx.fill();
      ctx.fillStyle='#fbffd0'; ctx.beginPath(); ctx.arc(x,y,1.8,0,TAU); ctx.fill();
    }
    ringLine(R,R*.96,'rgba(255,255,255,.45)',1.4);
  }
  function drawWoodfish(R){
    /* 木鱼俯视：木纹 + 中间一道开口 */
    const g=ctx.createRadialGradient(-R*.2,-R*.28,R*.05,0,0,R);
    g.addColorStop(0,'#b8804a'); g.addColorStop(.6,'#8a552c'); g.addColorStop(1,'#583317');
    disc(R,g);
    ringLine(R,R*.97,'rgba(240,200,140,.5)',2.2);
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.clip();
    ctx.strokeStyle='rgba(70,38,16,.3)'; ctx.lineWidth=1.4;
    for(let i=1;i<=6;i++){
      ctx.beginPath();
      ctx.ellipse(0,0,R*(.16+i*.13),R*(.13+i*.12),0,0,TAU); ctx.stroke();
    }
    /* 开口 */
    ctx.fillStyle='#3a2010';
    ctx.beginPath(); ctx.roundRect(-R*.62,-R*.1,R*1.24,R*.2,R*.1); ctx.fill();
    ctx.fillStyle='rgba(255,220,160,.25)';
    ctx.beginPath(); ctx.roundRect(-R*.62,-R*.1,R*1.24,R*.045,R*.02); ctx.fill();
    ctx.restore();
    /* 两颗旋涡 */
    for(const s of [-1,1]){
      ctx.strokeStyle='rgba(60,32,14,.45)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(s*R*.4,-R*.34,R*.12,.2,Math.PI*1.7); ctx.stroke();
    }
  }
  function drawPond(R){
    /* 池塘：静静的水面 + 荷叶 + 涟漪 */
    const g=ctx.createRadialGradient(-R*.2,-R*.3,R*.05,0,0,R);
    g.addColorStop(0,'#4f9a9e'); g.addColorStop(.6,'#2b6e78'); g.addColorStop(1,'#123e4a');
    disc(R,g);
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R,0,TAU); ctx.clip();
    ctx.strokeStyle='rgba(190,235,235,.28)'; ctx.lineWidth=1.4;
    for(let i=1;i<=5;i++){
      ctx.beginPath();
      for(let k=0;k<=44;k++){
        const a=k/44*TAU, rr=R*.17*i+Math.sin(a*3+T*.5+i)*2.6;
        const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
        k?ctx.lineTo(x,y):ctx.moveTo(x,y);
      }
      ctx.closePath(); ctx.stroke();
    }
    /* 荷叶 */
    for(let i=0;i<3;i++){
      const a=i/3*TAU+.5, x=Math.cos(a)*R*.6, y=Math.sin(a)*R*.6;
      ctx.fillStyle='rgba(96,160,86,.85)';
      ctx.beginPath(); ctx.arc(x,y,R*.16,-.2,TAU-.2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(30,80,50,.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*R*.14,y+Math.sin(a)*R*.14); ctx.stroke();
    }
    ctx.restore();
    ringLine(R,R*.97,'rgba(170,225,220,.55)',2);
  }
  function drawOrange(R){
    /* 橙子截面：一圈瓣 + 白色瓤心 */
    disc(R,'#e88b26');
    ringLine(R,R*.97,'#ffb359',R*.06);
    disc(R*.87,'#fff1d8');
    ctx.save(); ctx.beginPath(); ctx.arc(0,0,R*.86,0,TAU); ctx.clip();
    for(let i=0;i<9;i++){
      const a=i/9*TAU;
      ctx.save(); ctx.rotate(a);
      const g=ctx.createLinearGradient(0,-R*.16,0,-R*.82);
      g.addColorStop(0,'#ffd07a'); g.addColorStop(1,'#ff9428');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(0,-R*.12);
      ctx.quadraticCurveTo(R*.24,-R*.48,0,-R*.84);
      ctx.quadraticCurveTo(-R*.24,-R*.48,0,-R*.12);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(255,240,205,.85)'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    disc(R*.12,'#fff6e6');
    ringLine(R,R*.12,'rgba(240,180,110,.7)',1.6);
    ringLine(R,R*.87,'rgba(255,225,175,.8)',1.4);
  }

  /* =========================================================
     星链：一条银色链条 + 末端一颗星
     ========================================================= */
  function drawStar(x,y,r,alpha,color,glow){
    ctx.save();
    ctx.globalAlpha=alpha===undefined?1:alpha;
    ctx.translate(x,y);
    if(glow){ ctx.shadowColor=color||'#dfe6ff'; ctx.shadowBlur=glow; }
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const rr=i%2?r*.42:r, a=-Math.PI/2+i*Math.PI/5;
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle=color||'#eef3ff';
    ctx.fill();
    ctx.restore();
  }

  /* =========================================================

     约定：stem(L,seed) 在局部坐标里画，(0,0) 是圆心边缘，(L,0) 是针头方向

  function stemCurve(L,fn,style,width,alpha){
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle=style; ctx.lineWidth=width; ctx.globalAlpha=alpha===undefined?1:alpha;
    ctx.beginPath();
    for(let i=0;i<=24;i++){
      const t=i/24, x=L*t, y=fn(t);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke(); ctx.restore();
  }
  function stemBeads(L,fn,color,r,n,alpha){
    ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha; ctx.fillStyle=color;
    for(let i=1;i<=n;i++){

      ctx.beginPath(); ctx.arc(L*t,fn(t),r,0,TAU); ctx.fill();

    ctx.restore();

  /* 老主题用的默认银线，改成同一套局部坐标 */

    ctx.strokeStyle=g; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(L,0); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.moveTo(0,-1); ctx.lineTo(L,-1); ctx.stroke();
    if(links){
      const n=Math.max(2,Math.round(L/10));
      for(let i=1;i<n;i++){

        ctx.beginPath(); ctx.arc(L*i/n,0,2,0,TAU); ctx.stroke();

    }
    ctx.restore();
  }

  /* 流动的红酒 · 藏在喝酒下的情感泪：细泪痕 + 玻璃泪滴，不再是红色肉柱 */
  function stemWine(L){

    stemCurve(L,f,'rgba(226,196,178,.22)',3.0);          /* 一层将散的暖雾 */
    stemCurve(L,f,'rgba(255,234,218,.62)',1.0);          /* 一道极细的泪痕高光 */
    stemCurve(L,t=>f(t)+1.6,'rgba(150,66,84,.30)',.9);  /* 底下压着一点没说出口的酒色 */
    stemBeads(L,f,'rgba(255,238,226,.72)',1.4,3,.85);   /* 将坠未坠的小泪珠 */
  }

    ctx.strokeStyle='rgba(190,72,98,.5)'; ctx.lineWidth=1;

    ctx.moveTo(0,-12); ctx.bezierCurveTo(4.6,-4,5.2,0,0,2.4);
