/* ================= HUD ================= */
function drawAvatar(){
  var a=$('av'),x=a.getContext('2d');x.imageSmoothingEnabled=false;
  x.clearRect(0,0,40,40);
  x.fillStyle='rgba(255,255,255,.06)';x.fillRect(0,0,40,40);
  x.save();x.translate(6,4);x.scale(2,2);drawChar(x,0,0,'down',0,colors());x.restore();
}
function phaseName(){
  var c=S.clock;
  if(c<0.22)return '清晨';if(c<0.55)return '白天';if(c<0.72)return '黄昏';return '夜晚';
}
function weatherName(){
  var w=WEATHERS[S.weather]||WEATHERS.sun;
  var n=w.n;
  if(S.weather2&&WEATHERS[S.weather2])n+='·'+WEATHERS[S.weather2].n;
  return n;
}
function weatherEmoji(){var w=WEATHERS[S.weather];return w?w.e:'☀️';}
function regionName(){
  var r=region(Math.floor(S.px/TILE),Math.floor(S.py/TILE));
  return {village:'青叶村',garden:'琉璃花园',snow:'雪松岭',bamboo:'风竹林',lake:'镜湖畔',forest:'向日葵野',edge:'世界边缘'}[r]||'郊野';
}
function updateHUD(){
  $('nm').textContent=S.name;
  $('lv').textContent='Lv.'+S.lv;
  var hpr=clamp(S.hp/S.maxhp,0,1);
  $('hpbar').style.width=hpr*100+'%';
  $('hpbar').style.background=hpr<0.3?'linear-gradient(90deg,#ff6b7a,#ff9a8b)':'linear-gradient(90deg,#ff8fa3,#ffc27a)';
  $('hptext').textContent='体力 '+Math.max(0,Math.round(S.hp))+'/'+S.maxhp+' · 经验 '+S.exp+'/'+S.expNeed+(hpr<0.3?' · ⚠ 该回村歇歇了':'');
  $('gold').textContent=S.gold;
  var ci=calInfo(), dg=danger();
  $('worldinfo').textContent=ci.month+'月'+ci.day+'日 '+seasonName()+' · '+regionName()+' · '+
    weatherEmoji()+weatherName()+(dg>0?' · 危险度'+dg:'');
  drawAvatar();
}

function createPanel(){
  var s=blank();S=s;
  var h='<div style="text-align:center"><div style="font-size:30px">🌿</div><h2 style="margin:6px 0 2px">小像素 · 大冒险</h2>'+
    '<p class="sub" style="margin-bottom:14px">一个能慢慢逛的小世界。先捏一个你的小旅人吧～</p></div>'+
    '<h3>叫什么名字</h3><input class="txt" id="cname" maxlength="8" value="小旅人">'+
    '<h3>挑个发色</h3><div class="swatches" id="cH"></div>'+
    '<h3>肤色</h3><div class="swatches" id="cS"></div>'+
    '<h3>衣服</h3><div class="swatches" id="cC"></div>'+
    '<h3>出门带点什么天赋</h3><div class="traits">'+
      '<div class="tr on" data-tr="luck"><b>🍀 幸运儿</b>运气 +3<br>开箱更顺</div>'+
      '<div class="tr" data-tr="atk"><b>⚔️ 大力气</b>力量 +3<br>硬碰硬更稳</div>'+
      '<div class="tr" data-tr="def"><b>🛡️ 结实</b>体魄 +3<br>体力上限 +8</div></div>'+
    '<button class="btn" id="startg">出发！</button><p class="credit">进度自动存在本机 · 随时能换造型</p>';
  openPanel(h,function(){
    var mk=function(id,arr,field){
      var el=$(id),t='';
      for(var z=0;z<arr.length;z++)t+='<div class="sw '+(z===0?'on':'')+'" data-z="'+z+'" style="background:'+arr[z].c+'"></div>';
      el.innerHTML=t;
      var sw=el.querySelectorAll('.sw');
      for(var w=0;w<sw.length;w++)sw[w].onclick=function(){
        S[field]=parseInt(this.getAttribute('data-z'),10);
        el.querySelectorAll('.sw').forEach(function(q){q.classList.remove('on');});
        this.classList.add('on');sfx('btn');
      };
    };
    mk('cH',HAIRS,'hair');mk('cS',SKINS,'skin');mk('cC',CLOTHS,'cloth');
    var trs=$('pnl').querySelectorAll('.tr');
    for(var q=0;q<trs.length;q++)trs[q].onclick=function(){
      trs.forEach(function(z){z.classList.remove('on');});this.classList.add('on');
      S.trait=this.getAttribute('data-tr');sfx('btn');
    };
    $('startg').onclick=function(){
      var v=$('cname').value.trim();S.name=v||'小旅人';
      if(S.trait==='luck')S.luck+=3;
      else if(S.trait==='atk')S.atk+=3;
      else{S.def+=3;S.maxhp+=4;S.hp+=4;}
      S.created=true;
      audio();startBGM();sfx('great');
      closePanel();updateHUD();save();
      setTimeout(function(){toast('欢迎来到青叶村，走走看吧 🌿');},400);
    };
  });
}
function welcomePanel(saved){
  openPanel('<div style="text-align:center"><div style="font-size:30px">🌿</div><h2 style="margin:6px 0">欢迎回来，'+saved.name+'</h2>'+
    '<p class="sub">Lv.'+saved.lv+' · 走了 '+Math.floor(saved.stats.steps)+' 步 · 图鉴 '+saved.colCount+' 件<br>'+
    '上次停在 '+(saved.lastRegion||'青叶村')+'，'+fmtTime(saved.savedAt)+' 自动存好的<br>小世界还和上次一样，接着逛吧。</p></div>'+
    '<button class="btn" id="go">继续冒险</button>'+
    '<button class="btn ghost" id="slotW">💾 存档 / 读档 / 去别处</button>'+
    '<button class="btn ghost" id="homeW">🏠 回入口</button>'+
    '<button class="btn ghost" id="newg">重新捏一个（清空进度）</button>',
    function(){
      $('go').onclick=function(){S=saved;muted=!!S.muted;audio();if(!muted)startBGM();sfx('btn');closePanel();snapCam();updateHUD();save();};
      $('slotW').onclick=function(){audio();saveSlotsPanel();};
      $('homeW').onclick=function(){location.href='index.html'+Q;};
      $('newg').onclick=function(){
        openPanel('<h2>重新开始？</h2><p class="sub">当前进度会清空，没法撤销哦。</p>'+
          '<div class="btnrow"><button class="btn ghost" id="no2">再想想</button><button class="btn" id="yes2">确定</button></div>',
          function(){$('no2').onclick=function(){welcomePanel(saved);};$('yes2').onclick=function(){localStorage.removeItem(SAVE);createPanel();};});
      };
    });
}

/* ================= 主循环 ================= */
var last=0,tt0=0,saveT=0;
function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;tt0+=dt;
  if(S&&S.created){
    if(!document.hidden){
      S.clock=(S.clock+dt/300)%1;
      /* 历法：3 分钟一周，日子就这么往前走 */
      S.calT+=dt;
      var cinf=calInfo();
      if(cinf.dayIndex!==S.lastDay){
        S.lastDay=cinf.dayIndex;
        if(S.lastSeason&&S.lastSeason!==cinf.season){
          toast('季节换了：'+seasonName()+'天到了 '+({spring:'🌸',summer:'🌿',autumn:'🍁',winter:'❄️'}[cinf.season]||''));
          sfx('great');
        }
        S.lastSeason=cinf.season;
      }
      S.weatherT+=dt;
      if(S.weatherT>(S.weatherDur||90)){
        var nw=rollWeather();
        S.weatherT=0;
        var wd=WEATHERS[nw]||WEATHERS.sun;
        toast('天气变了：'+wd.e+' '+weatherName()+(RARE_NOTE[nw]?' · '+RARE_NOTE[nw]:''));
        if(nw==='rainbow'||wd.rare)sfx('great');
      }
      if(!panelOpen&&!document.hidden)moveUpdate(dt,tt0);
      if(!panelOpen)updateAct();
      render(tt0,dt);
      saveT+=dt;
      if(saveT>12){saveT=0;save();updateHUD();}
    }
  }else if(S){render(tt0,dt);}
  requestAnimationFrame(loop);
}

/* ================= 启动 ================= */
function init(){
  resize();initParticles();bindStick();buildWorld();
  var saved=load();
  S=migrate(saved||blank());
  S.walk=0;
  snapCam();
  if(!S.buff)S.buff=null;
  if(!S.weather)S.weather='sun';
  if(typeof S.clock!=='number')S.clock=0.12;
  muted=!!S.muted;
  updateHUD();
  $('act').addEventListener('click',function(e){e.preventDefault();if(!panelOpen)doInteract();});
  $('menuBtn').addEventListener('click',function(e){e.preventDefault();audio();sfx('btn');menuPanel('char');});
  document.addEventListener('keydown',function(e){
    if(e.key==='e'||e.key==='E'||e.key===' '){if(!panelOpen){e.preventDefault();doInteract();}}
    if(e.key==='Escape'&&panelOpen)closePanel();
  });
  if(saved)welcomePanel(saved);else createPanel();
  requestAnimationFrame(loop);
}
init();
})();
</script>
</body>
</html>
